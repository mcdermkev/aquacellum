<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Breeder Storefront — Aquacellum</title>
  <meta name="description" content="Browse this breeder's live aquarium livestock. Tank-raised specimens with escrow-backed health guarantees from verified breeders on the Aquacellum protocol.">
  <meta property="og:title" content="Breeder Storefront — Aquacellum">
  <meta property="og:description" content="Tank-raised fish from a verified breeder. Protected by smart contract escrow with live-arrival guarantee.">
  <meta property="og:type" content="website">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/shared.css">

  <style>
    /* =========================================
       BANNER & PROFILE
    ========================================= */
    .store-banner { position: relative; width: 100%; height: 220px; overflow: hidden; background: linear-gradient(135deg, rgba(139,92,246,0.08), rgba(52,211,153,0.05)); }
    .store-banner img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.6s ease; }
    .store-banner img.loaded { opacity: 1; }
    .store-banner-overlay { position: absolute; inset: 0; background: linear-gradient(to top, var(--bg-void) 0%, transparent 60%); pointer-events: none; }
    .store-banner-fallback { width: 100%; height: 100%; background: linear-gradient(135deg, rgba(139,92,246,0.06), rgba(52,211,153,0.04), rgba(96,165,250,0.04)); animation: banner-drift 12s ease-in-out infinite alternate; }
    @keyframes banner-drift { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }

    .store-profile { display: flex; align-items: flex-start; gap: 1.25rem; margin-top: -56px; padding: 0 1rem; position: relative; z-index: 2; margin-bottom: 2rem; }
    .store-avatar-wrap { position: relative; flex-shrink: 0; }
    .store-avatar { width: 96px; height: 96px; border-radius: 50%; border: 3px solid rgba(139,92,246,0.3); box-shadow: 0 4px 20px rgba(0,0,0,0.4), 0 0 0 4px var(--bg-void); object-fit: cover; }
    .store-avatar-placeholder { width: 96px; height: 96px; border-radius: 50%; border: 3px solid rgba(139,92,246,0.3); box-shadow: 0 4px 20px rgba(0,0,0,0.4), 0 0 0 4px var(--bg-void); display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--violet-500), var(--purple-400)); font-family: 'Outfit', sans-serif; font-size: 2rem; font-weight: 700; color: #fff; }
    .store-master-crown { position: absolute; top: -4px; right: -4px; width: 28px; height: 28px; border-radius: 50%; background: rgba(251,191,36,0.15); border: 2px solid rgba(251,191,36,0.4); display: flex; align-items: center; justify-content: center; font-size: 0.75rem; animation: crown-glow 2.5s ease-in-out infinite alternate; }
    @keyframes crown-glow { 0% { box-shadow: 0 0 6px rgba(251,191,36,0.2); } 100% { box-shadow: 0 0 16px rgba(251,191,36,0.5); } }

    .store-info { padding-top: 20px; flex: 1; min-width: 0; }
    .store-name-row { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
    .store-name { font-family: 'Outfit', sans-serif; font-size: 1.6rem; font-weight: 800; color: #fff; margin: 0; }
    .store-trust-badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 50px; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; background: rgba(52,211,153,0.1); border: 1px solid rgba(52,211,153,0.3); color: var(--emerald-300); }
    .store-bio { margin-top: 10px; font-size: 0.88rem; line-height: 1.6; color: var(--text-secondary); max-width: 600px; }
    .store-meta { display: flex; align-items: center; gap: 1rem; margin-top: 10px; flex-wrap: wrap; }
    .store-location { display: inline-flex; align-items: center; gap: 4px; font-size: 0.78rem; color: var(--text-muted); }
    .store-specialties { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .store-specialty { padding: 3px 10px; border-radius: 50px; font-size: 0.65rem; font-weight: 600; background: rgba(139,92,246,0.08); border: 1px solid rgba(139,92,246,0.2); color: var(--violet-300); }
    /* =========================================
       STATS BAR
    ========================================= */
    .stats-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 2.5rem; }
    .stat-card { display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: var(--radius-sm); backdrop-filter: blur(12px); transition: var(--transition); }
    .stat-card:hover { border-color: rgba(139,92,246,0.2); transform: translateY(-2px); }
    .stat-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1rem; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); flex-shrink: 0; }
    .stat-value { font-family: 'Outfit', sans-serif; font-size: 1.1rem; font-weight: 700; color: #fff; }
    .stat-label { font-size: 0.65rem; color: var(--text-muted); font-weight: 500; margin-top: 2px; }

    /* =========================================
       LISTINGS SECTION
    ========================================= */
    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
    .section-title { font-family: 'Outfit', sans-serif; font-size: 1.1rem; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 10px; }
    .section-count { font-size: 0.7rem; font-weight: 500; color: var(--text-muted); background: rgba(255,255,255,0.04); padding: 3px 10px; border-radius: 50px; }

    .listings-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 20px; margin-bottom: 3rem; }
    .listing-card {
      aspect-ratio: 3 / 4; border-radius: var(--radius-md); overflow: hidden; cursor: pointer;
      position: relative; background: var(--glass-bg); border: 1px solid var(--glass-border);
      transition: transform 0.35s cubic-bezier(0.4,0,0.2,1), box-shadow 0.35s ease, border-color 0.35s ease;
      display: flex; flex-direction: column; opacity: 0; transform: translateY(20px);
    }
    .listing-card.visible { opacity: 1; transform: translateY(0); transition: transform 0.5s cubic-bezier(0.4,0,0.2,1), opacity 0.4s ease, box-shadow 0.35s, border-color 0.35s; }
    .listing-card:hover { border-color: rgba(139,92,246,0.3); transform: translateY(-4px); box-shadow: 0 16px 48px rgba(139,92,246,0.08); }
    .listing-card.tier-wild { border-width: 2px; border-color: rgba(251,191,36,0.25); }
    .listing-card.tier-wild::before { content: ''; position: absolute; inset: -2px; border-radius: var(--radius-md); padding: 2px; background: linear-gradient(135deg, rgba(251,191,36,0.5), rgba(232,121,249,0.4), rgba(139,92,246,0.4), rgba(96,165,250,0.3), rgba(251,191,36,0.5)); background-size: 300% 300%; animation: holo 6s ease-in-out infinite; -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; z-index: 3; opacity: 0.6; }
    .listing-card.tier-wild:hover::before { opacity: 1; }
    @keyframes holo { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    .listing-card.tier-purebred { border-color: rgba(52,211,153,0.12); border-width: 1.5px; }
    .listing-card.tier-purebred:hover { box-shadow: 0 14px 44px rgba(52,211,153,0.12); border-color: rgba(52,211,153,0.35); }

    .card-image { flex: 1; position: relative; overflow: hidden; background: rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center; }
    .card-image img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.45s ease; }
    .listing-card:hover .card-image img { transform: scale(1.06); }
    .card-image .placeholder-icon { font-size: 3rem; opacity: 0.4; }
    .card-badge { position: absolute; top: 10px; left: 10px; z-index: 4; padding: 4px 10px; border-radius: 20px; font-size: 0.6rem; font-weight: 700; backdrop-filter: blur(8px); }
    .badge-wild { background: rgba(251,191,36,0.15); border: 1px solid rgba(251,191,36,0.4); color: #fbbf24; }
    .badge-purebred { background: rgba(52,211,153,0.12); border: 1px solid rgba(52,211,153,0.35); color: #34d399; }
    .badge-f1 { background: rgba(96,165,250,0.12); border: 1px solid rgba(96,165,250,0.35); color: #60a5fa; }
    .badge-batch { background: rgba(56,189,248,0.12); border: 1px solid rgba(56,189,248,0.35); color: #7dd3fc; }
    .card-price { position: absolute; top: 10px; right: 10px; z-index: 4; font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; font-weight: 700; padding: 4px 10px; border-radius: 20px; background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.35); color: var(--emerald-300); backdrop-filter: blur(8px); }
    .card-info { padding: 14px 16px 12px; background: linear-gradient(180deg, rgba(15,12,31,0.95), rgba(10,8,22,1)); border-top: 1px solid var(--glass-border); }
    .card-name { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 0.9rem; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-sci { font-size: 0.68rem; font-style: italic; color: var(--violet-400); margin-top: 2px; }
    .card-cta { font-size: 0.65rem; font-weight: 600; color: var(--violet-300); opacity: 0; transition: opacity 0.3s; margin-top: 6px; }
    .listing-card:hover .card-cta { opacity: 1; }
    /* =========================================
       REVIEWS & EMPTY/LOADING STATES
    ========================================= */
    .reviews-section { margin-bottom: 3rem; }
    .review-card { padding: 16px 20px; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: var(--radius-sm); margin-bottom: 10px; transition: var(--transition); }
    .review-card:hover { border-color: rgba(139,92,246,0.2); }
    .review-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .review-author { font-size: 0.78rem; font-weight: 600; color: var(--text-primary); }
    .review-stars { font-size: 0.82rem; color: var(--amber-400); }
    .review-body { font-size: 0.82rem; color: var(--text-secondary); line-height: 1.6; }
    .review-date { font-size: 0.62rem; color: var(--text-muted); margin-top: 8px; }

    /* Responsive */
    @media (max-width: 768px) {
      .store-banner { height: 160px; }
      .store-profile { flex-direction: column; align-items: center; text-align: center; margin-top: -40px; gap: 12px; }
      .store-avatar, .store-avatar-placeholder { width: 80px; height: 80px; }
      .store-name { font-size: 1.3rem; }
      .store-name-row { justify-content: center; }
      .store-bio { margin-left: auto; margin-right: auto; }
      .store-meta { justify-content: center; }
      .store-specialties { justify-content: center; }
      .stats-bar { grid-template-columns: repeat(2, 1fr); }
      .listings-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
      .listing-card { aspect-ratio: 2.5 / 4; }
      .card-info { padding: 10px 12px 8px; }
      .card-name { font-size: 0.8rem; }
    }
    @media (max-width: 480px) {
      .stats-bar { grid-template-columns: 1fr 1fr; gap: 8px; }
      .stat-card { padding: 10px 12px; }
      .listings-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    }
  </style>
</head>
<body>
  <!-- Navigation -->
  <header id="site-nav"></header>

  <!-- Loading State -->
  <div id="loadingState" class="loading-state">
    <div class="loading-spinner"></div>
    <p>Loading storefront...</p>
  </div>

  <!-- Main Content (hidden until loaded) -->
  <div id="storeContent" style="display:none;">
    <!-- Banner -->
    <div class="store-banner" id="storeBanner">
      <div class="store-banner-fallback"></div>
      <div class="store-banner-overlay"></div>
    </div>

    <!-- Profile -->
    <div class="container">
      <div class="store-profile" id="storeProfile"></div>

      <!-- Stats -->
      <div class="stats-bar" id="statsBar"></div>

      <!-- Listings -->
      <div class="section-header">
        <div class="section-title">🐟 Active Listings <span class="section-count" id="listingCount">0</span></div>
      </div>
      <div class="listings-grid" id="listingsGrid"></div>

      <!-- Reviews -->
      <div class="reviews-section" id="reviewsSection" style="display:none;">
        <div class="section-header">
          <div class="section-title">⭐ Reviews</div>
        </div>
        <div id="reviewsList"></div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer id="site-footer"></footer>

  <script src="/js/nav.js"></script>
  <script src="/js/footer.js"></script>
  <script src="/js/reveal.js"></script>
  <script>
    // ── Configuration ──────────────────────────────────────────────────────
    const SUPABASE_URL = 'https://yahsdztnvsykzecjatsl.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlhaHNkenRudnN5a3plY2phdHNsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0OTQwMDgsImV4cCI6MjA5NjA3MDAwOH0.3anqDFU9hUjZg2AFWJlXSBbwSM-knNrmb-uQ_Baq98I';
    const IPFS_GATEWAY = 'https://gateway.pinata.cloud/ipfs';

    // ── Alias Generator ───────────────────────────────────────────────────
    const ADJECTIVES = ["Coral","Sapphire","Drift","Lunar","Ember","Misty","Crystal","Tide","Storm","Solar","Velvet","Copper","Silver","Frost","Dusk","Reef","Azure","Pearl","Golden","Moss"];
    const FISH_NAMES = ["Tetra","Guppy","Betta","Pleco","Rasbora","Danio","Cory","Molly","Barb","Loach","Killi","Goby","Wrasse","Tang","Angel","Discus","Oscar","Arowana","Pike","Darter"];
    function generateAlias(address) {
      if (!address || address.length < 10) return "Unknown Keeper";
      const n = address.toLowerCase().replace("0x", "");
      return ADJECTIVES[parseInt(n.slice(0,4),16) % ADJECTIVES.length] + ' ' + FISH_NAMES[parseInt(n.slice(4,8),16) % FISH_NAMES.length] + ' ' + ((parseInt(n.slice(8,12),16) % 9000) + 1000);
    }

    // ── Get Slug from URL ─────────────────────────────────────────────────
    function getSlugFromUrl() {
      const path = window.location.pathname;
      const match = path.match(/\/store\/(.+)/);
      return match ? match[1].replace(/\/$/, '') : null;
    }

    // ── Price Helper ──────────────────────────────────────────────────────
    function ethToUSD(priceEth) {
      const usd = parseFloat(priceEth || 0) * 1000;
      if (usd <= 0) return 'Free';
      return '$' + usd.toFixed(2);
    }

    // ── Pedigree ──────────────────────────────────────────────────────────
    function getPedigree(item) {
      if (item.isBatch) return { label: 'Batch Fry', cls: 'batch', tier: '' };
      const s = Number(item.sireId || 0), d = Number(item.damId || 0);
      if (s === 0 && d === 0) return { label: 'Wild Caught', cls: 'wild', tier: 'tier-wild' };
      if ((s !== 0 && d === 0) || (s === 0 && d !== 0)) return { label: 'F1 Bred', cls: 'f1', tier: '' };
      return { label: 'Purebred', cls: 'purebred', tier: 'tier-purebred' };
    }
    // ── Normalize API response shape ──────────────────────────────────────
    // The /api/storefront-detail endpoint returns the profile under `breeder`
    // with camelCase stats and nested listing objects. renderStorefront()
    // expects `profile` with snake_case stats and flat listings. Map between them.
    function normalizeApiResponse(data) {
      if (!data || !data.breeder) return data; // already in {profile,stats,...} shape
      const b = data.breeder || {};
      const s = data.stats || {};
      return {
        profile: {
          display_name: b.displayName,
          wallet_address: b.walletAddress,
          slug: b.slug,
          bio: b.bio,
          location: b.location,
          specialties: b.specialties || [],
          is_master_breeder: b.isMasterBreeder,
          avatar_url: b.avatarUrl || null,
          banner_url: b.bannerUrl || null,
        },
        stats: {
          avg_rating: s.avgRating,
          review_count: s.reviewCount,
          species_count: s.speciesCount,
          total_listings: s.totalListings,
          total_sales: s.totalSales,
        },
        listings: (data.listings || []).map(l => ({
          commonName: l.species?.commonName,
          scientificName: l.species?.scientificName,
          price: l.price?.eth,
          isBatch: l.type === 'batch',
          quantity: l.quantity,
          imageUrl: l.imageUrl,
        })),
        reviews: data.reviews || [],
      };
    }

    // ── Initialize ─────────────────────────────────────────────────────────
    async function init() {
      const slug = getSlugFromUrl();
      if (!slug) { showError('No storefront specified.'); return; }

      try {
        // Fetch storefront data via API
        const res = await fetch(`/api/storefront-detail?id=${encodeURIComponent(slug)}`);
        if (!res.ok) throw new Error('Storefront not found');
        const data = await res.json();
        renderStorefront(normalizeApiResponse(data));
      } catch (e) {
        // Fallback: try direct Supabase query
        try {
          const profileRes = await fetch(
            `${SUPABASE_URL}/rest/v1/breeder_profiles?or=(slug.eq.${slug},wallet_address.eq.${slug})&limit=1`,
            { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } }
          );
          if (profileRes.ok) {
            const profiles = await profileRes.json();
            if (profiles.length > 0) {
              const p = profiles[0];
              // Fetch stats
              const statsRes = await fetch(
                `${SUPABASE_URL}/rest/v1/breeder_stats?wallet_address=eq.${p.wallet_address}`,
                { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } }
              );
              let stats = {};
              if (statsRes.ok) { const s = await statsRes.json(); stats = s[0] || {}; }
              // Fetch listings
              const listingsRes = await fetch(
                `${SUPABASE_URL}/rest/v1/aquadex_listings?is_active=eq.true&order=created_at.desc&limit=50`,
                { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } }
              );
              let listings = [];
              if (listingsRes.ok) {
                const rows = await listingsRes.json();
                listings = rows.map(r => { try { return typeof r.data === 'string' ? JSON.parse(r.data) : r.data; } catch { return null; } }).filter(Boolean);
                listings = listings.filter(l => l.seller?.toLowerCase() === p.wallet_address.toLowerCase());
              }
              renderStorefront({ profile: p, stats, listings, reviews: [] });
              return;
            }
          }
          showError('Storefront not found. This breeder may not have set up their page yet.');
        } catch (e2) {
          showError('Unable to load storefront. Please try again later.');
        }
      }
    }

    function showError(msg) {
      // Before showing error, check if it's a demo slug
      const slug = getSlugFromUrl();
      const demoData = getDemoStorefront(slug);
      if (demoData) { renderStorefront(demoData); return; }
      document.getElementById('loadingState').innerHTML = `<div class="empty-state"><h3>😔 ${msg}</h3><p><a href="/breeders.html" style="color:var(--violet-400);">Browse all breeders →</a></p></div>`;
    }

          stats: { avg_rating: 4.9, review_count: 38, species_count: 8, total_listings: 12, total_sales: 47 },

            { commonName: 'Triple Red Apistogramma', scientificName: 'Apistogramma cacatuoides', price: '0.035', sireId: 7, damId: 3, isBatch: false, isShipping: true },
            { commonName: 'German Blue Ram', scientificName: 'Mikrogeophagus ramirezi', price: '0.018', sireId: 0, damId: 0, isBatch: false, isShipping: true },
            { commonName: 'Apistogramma Agassizii', scientificName: 'Apistogramma agassizii', price: '0.028', sireId: 2, damId: 5, isBatch: false, isShipping: true },
            { commonName: 'Cockatoo Cichlid Fry Batch', scientificName: 'Apistogramma cacatuoides', price: '0.008', isBatch: true, quantity: 12, isShipping: true },
            { commonName: 'Bolivian Ram Pair', scientificName: 'Mikrogeophagus altispinosus', price: '0.042', sireId: 1, damId: 1, isBatch: false, isShipping: true },
          ],
          reviews: [
            { author: 'Jade Tetra 1177', rating: 5, body: 'Incredible color on the Triple Reds. Arrived healthy and already showing full fin extension within a week. Will buy again.', date: '2026-05-12' },
            { author: 'Reef Cory 4455', rating: 5, body: 'Best apistos I\'ve ever received shipped. Perfectly packed with heat pack and breather bags. Fish were calm and unstressed.', date: '2026-04-28' },

        },
        'drift-pleco': {

          stats: { avg_rating: 5.0, review_count: 72, species_count: 15, total_listings: 24, total_sales: 89 },
          listings: [
            { commonName: 'Gold Nugget L018', scientificName: 'Baryancistrus xanthellus', price: '0.095', sireId: 0, damId: 0, isBatch: false, isShipping: true },
            { commonName: 'Super Red Bristlenose', scientificName: 'Ancistrus sp.', price: '0.022', sireId: 4, damId: 7, isBatch: false, isShipping: true },

    // ── Render Storefront ────────────────────────────────────────────────
    function renderStorefront(data) {
      const profile = data.profile || {};
      const stats = data.stats || {};
      const listings = data.listings || [];
      const reviews = data.reviews || [];

      const name = profile.display_name || generateAlias(profile.wallet_address);
      const initial = name.charAt(0).toUpperCase();
      const isMaster = profile.is_master_breeder || false;
      const specialties = profile.specialties || [];
      const location = profile.location || '';
      const bio = profile.bio || '';

      // Update page title
      document.title = `${name} — Breeder Storefront | Aquacellum`;

      // Banner
      const bannerEl = document.getElementById('storeBanner');
      const bannerSrc = profile.banner_url || (profile.banner_cid ? `${IPFS_GATEWAY}/${profile.banner_cid}` : null);
      if (bannerSrc) {
        bannerEl.innerHTML = `<img src="${bannerSrc}" alt="Banner" onload="this.classList.add('loaded')"><div class="store-banner-overlay"></div>`;
      }

      // Profile
      const avatarSrc = profile.avatar_url || (profile.avatar_cid ? `${IPFS_GATEWAY}/${profile.avatar_cid}` : null);
      const avatarHtml = avatarSrc
        ? `<img class="store-avatar" src="${avatarSrc}" alt="${name}">`
        : `<div class="store-avatar-placeholder">${initial}</div>`;

      document.getElementById('storeProfile').innerHTML = `
        <div class="store-avatar-wrap">
          ${avatarHtml}
          ${isMaster ? '<div class="store-master-crown">👑</div>' : ''}
        </div>
        <div class="store-info">
          <div class="store-name-row">
            <h1 class="store-name">${name}</h1>
            <span class="store-trust-badge">✓ Verified Breeder</span>
          </div>
          ${bio ? `<p class="store-bio">${bio}</p>` : ''}
          <div class="store-meta">
            ${location ? `<span class="store-location">📍 ${location}</span>` : ''}
          </div>
          ${specialties.length ? `<div class="store-specialties">${specialties.map(s => `<span class="store-specialty">${s}</span>`).join('')}</div>` : ''}
        </div>
      `;

      // Stats
      const rating = stats.avg_rating ? parseFloat(stats.avg_rating).toFixed(1) : '—';
      document.getElementById('statsBar').innerHTML = `
        <div class="stat-card"><div class="stat-icon">⭐</div><div><div class="stat-value">${rating}</div><div class="stat-label">Rating (${stats.review_count || 0} reviews)</div></div></div>
        <div class="stat-card"><div class="stat-icon">🐟</div><div><div class="stat-value">${stats.species_count || 0}</div><div class="stat-label">Species</div></div></div>
        <div class="stat-card"><div class="stat-icon">📦</div><div><div class="stat-value">${stats.total_listings || listings.length}</div><div class="stat-label">Active Listings</div></div></div>
        <div class="stat-card"><div class="stat-icon">✓</div><div><div class="stat-value">${stats.total_sales || 0}</div><div class="stat-label">Completed Sales</div></div></div>
      `;

      // Listings
      document.getElementById('listingCount').textContent = listings.length;
      if (listings.length === 0) {
        document.getElementById('listingsGrid').innerHTML = '<div class="empty-state"><h3>No active listings</h3><p>This breeder hasn\'t listed any specimens yet. Check back soon!</p></div>';
      } else {
        renderListings(listings);
      }

      // Reviews
      if (reviews.length > 0) {
        document.getElementById('reviewsSection').style.display = '';
        document.getElementById('reviewsList').innerHTML = reviews.map(r => `
          <div class="review-card">
            <div class="review-header">
              <span class="review-author">${r.author || 'Anonymous'}</span>
              <span class="review-stars">${'⭐'.repeat(r.rating || 5)}</span>
            </div>
            <div class="review-body">${r.body || ''}</div>
            <div class="review-date">${r.date || ''}</div>
          </div>
        `).join('');
      }

      // Show content
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('storeContent').style.display = '';
    }
    // ── Render Listings Grid ──────────────────────────────────────────────
    function renderListings(listings) {
      const grid = document.getElementById('listingsGrid');

      // Try to get species images from fishbase
      let fishbaseData = [];
      fetch('/fishbase_master.json').then(r => r.ok ? r.json() : []).then(data => {
        fishbaseData = data;
        // Re-render with images
        grid.innerHTML = listings.map((item, idx) => buildListingCard(item, idx, fishbaseData)).join('');
        animateCards(grid);
      }).catch(() => {
        grid.innerHTML = listings.map((item, idx) => buildListingCard(item, idx, [])).join('');
        animateCards(grid);
      });
    }

    function buildListingCard(item, idx, fishbaseData) {
      const pedigree = getPedigree(item);
      const price = ethToUSD(item.price);
      const imgUrl = getSpeciesImage(item.scientificName, fishbaseData);
      const imageHtml = imgUrl
        ? `<img src="${imgUrl}" alt="${item.commonName || 'Fish'}" loading="lazy">`
        : '<span class="placeholder-icon">🐟</span>';

      return `
        <div class="listing-card ${pedigree.tier}" data-idx="${idx}">
          <div class="card-image">
            ${imageHtml}
            <span class="card-badge badge-${pedigree.cls}">${pedigree.label}</span>
            <span class="card-price">${price}</span>
          </div>
          <div class="card-info">
            <div class="card-name">${item.commonName || 'Unknown Species'}</div>
            <div class="card-sci">${item.scientificName || ''}</div>
            <div class="card-cta">View Details →</div>
          </div>
        </div>`;
    }

    function getSpeciesImage(scientificName, fishbaseData) {
      if (!scientificName || !fishbaseData.length) return '';
      const match = fishbaseData.find(f => f.scientificName?.toLowerCase() === scientificName.toLowerCase());
      return match?.masterPhotoUrl || '';
    }

    function animateCards(grid) {
      requestAnimationFrame(() => {
        const cards = grid.querySelectorAll('.listing-card');
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              const idx = Array.from(cards).indexOf(entry.target) % 6;
              setTimeout(() => entry.target.classList.add('visible'), idx * 70);
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.05, rootMargin: '50px' });
        cards.forEach(card => observer.observe(card));
      });
    }

    // ── Boot ───────────────────────────────────────────────────────────────
    init();
  </script>
