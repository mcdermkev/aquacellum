    function geocodeLocation(location) {
      if (!location) return null;
      const loc = location.toLowerCase().trim();
      // Direct match
      if (CITY_COORDS[loc]) return CITY_COORDS[loc];
      // Partial match
      for (const [key, coords] of Object.entries(CITY_COORDS)) {
        if (loc.includes(key) || key.includes(loc)) return coords;
      }
      // Try splitting on comma and matching parts
      const parts = loc.split(',').map(p => p.trim());
      for (const part of parts) {
        if (CITY_COORDS[part]) return CITY_COORDS[part];
        for (const [key, coords] of Object.entries(CITY_COORDS)) {
          if (part.includes(key) || key.includes(part)) return coords;
        }
      }
      return null;
    }

    // ── Fetch Breeders ────────────────────────────────────────────────────
    async function fetchBreeders() {
      try {
        // Fetch breeder profiles that have storefronts active
        const profilesRes = await fetch(
          `${SUPABASE_URL}/rest/v1/breeder_profiles?storefront_active=eq.true&select=wallet_address,display_name,slug,bio,location,specialties,is_master_breeder,avatar_cid,current_tier`,
          { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } }
        );

        let profiles = [];
        if (profilesRes.ok) profiles = await profilesRes.json();

        // Fetch stats for these breeders
        let statsMap = {};
        if (profiles.length > 0) {
          const wallets = profiles.map(p => `"${p.wallet_address}"`).join(',');
          const statsRes = await fetch(
            `${SUPABASE_URL}/rest/v1/breeder_stats?wallet_address=in.(${wallets})&select=wallet_address,total_sales,total_listings,avg_rating,review_count,species_count`,
            { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } }
          );
          if (statsRes.ok) {
            const stats = await statsRes.json();
            stats.forEach(s => { statsMap[s.wallet_address] = s; });
          }
        }

        // Also fetch from basic profiles table for those without breeder_profiles
        const basicRes = await fetch(
          `${SUPABASE_URL}/rest/v1/profiles?select=wallet_address,display_name,avatar_url,bio`,
          { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } }
        );
        let basicProfiles = [];
        if (basicRes.ok) basicProfiles = await basicRes.json();

        // Merge: breeder_profiles take priority
        const breederWallets = new Set(profiles.map(p => p.wallet_address));
        const merged = profiles.map(p => ({
          wallet: p.wallet_address,
          name: p.display_name || generateAlias(p.wallet_address),
          slug: p.slug,
          bio: p.bio || '',
          location: p.location || '',
          specialties: p.specialties || [],
          isMaster: p.is_master_breeder || false,
          tier: p.current_tier || 'Shallow',
          coords: geocodeLocation(p.location),
          stats: statsMap[p.wallet_address] || { total_sales: 0, total_listings: 0, avg_rating: 0, review_count: 0, species_count: 0 },
        }));

        // Filter to those with valid coordinates
        allBreeders = merged.filter(b => b.coords !== null);

        // If we have very few, add some reasonable spread for demo purposes
        if (allBreeders.length === 0) {
          allBreeders = generateDemoBreeders();
        }

      } catch (e) {
        console.warn('Failed to fetch breeders:', e);
        allBreeders = generateDemoBreeders();
      }

      document.getElementById('loadingState').style.display = 'none';
      applyFilters();
      updateMapStats();
    }

    // ── Haversine distance (miles) ────────────────────────────────────────
    function getDistance(from, to) {
      const R = 3959; // Earth radius in miles
      const dLat = (to[0] - from[0]) * Math.PI / 180;
      const dLon = (to[1] - from[1]) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(from[0] * Math.PI / 180) * Math.cos(to[0] * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function formatDistance(miles) {
      if (miles < 1) return '< 1 mi';
      if (miles < 100) return Math.round(miles) + ' mi';
      return Math.round(miles) + ' mi';
    }

    // ── Select Breeder ──────────────────────────────────────────────────
    function selectBreeder(idx, panMap = true) {
      const b = filteredBreeders[idx];
      if (!b) return;

      // Highlight card
      document.querySelectorAll('.breeder-card').forEach(c => c.classList.remove('active'));
      const card = document.querySelector(`.breeder-card[data-idx="${idx}"]`);
      if (card) {
        card.classList.add('active');
        card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      // Highlight marker
      markers.forEach((m, i) => {
        const el = m.getElement();
        if (el) {
          const inner = el.querySelector('.custom-marker');
          if (inner) inner.classList.toggle('active-marker', i === idx);
        }
      });

      // Pan map
      if (panMap && b.coords) {
        map.flyTo(b.coords, 10, { duration: 0.8 });
        markers[idx]?.openPopup();
      }

      activeCard = idx;
    }

    // ── Geolocation ──────────────────────────────────────────────────────
    function locateMe() {
      const btn = document.getElementById('locateBtn');

      if (userLocation) {
        // Toggle off
        userLocation = null;
        btn.classList.remove('active');
        if (userLocationMarker) { map.removeLayer(userLocationMarker); userLocationMarker = null; }
        applyFilters();
        map.flyTo([39.828, -98.580], 4, { duration: 0.8 });
        return;
      }

      if (!navigator.geolocation) {
        alert('Geolocation is not supported by your browser.');
        return;
      }

      btn.textContent = '⏳ Locating...';
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          userLocation = [pos.coords.latitude, pos.coords.longitude];
          btn.classList.add('active');
          btn.innerHTML = '<svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3"/></svg> Near Me ✓';

          // Add user marker
          const userIcon = L.divIcon({
            html: '<div class="user-location-marker"></div>',
            className: '',
            iconSize: [20, 20],
            iconAnchor: [10, 10],
          });
          userLocationMarker = L.marker(userLocation, { icon: userIcon, zIndexOffset: 1000 }).addTo(map);
          userLocationMarker.bindPopup('<div style="font-size:0.75rem;font-weight:600;color:#f5f3ff;">📍 You are here</div>', { closeButton: false });

          map.flyTo(userLocation, 7, { duration: 1.2 });
          applyFilters();
        },
        (err) => {
          btn.innerHTML = '<svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3"/></svg> Near Me';
          console.warn('Geolocation failed:', err.message);
          alert('Unable to get your location. Please allow location access and try again.');
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

        sidebar.classList.add('collapsed');
        mobileView = 'map';
        document.getElementById('mobileToggle').textContent = '📋 Show Breeders';
      }
    }

    // Leaflet needs to know when the map container resizes
    window.addEventListener('resize', () => { if (map) setTimeout(() => map.invalidateSize(), 100); });
    // Also after toggling mobile view
    const origToggle = toggleMobileView;
    toggleMobileView = function() {
      origToggle();
      if (map) setTimeout(() => map.invalidateSize(), 350);
    };

    // ── Boot ───────────────────────────────────────────────────────────────
    initMap();
    initMobileState();
    fetchBreeders();
  </script>

</body>
</html>
