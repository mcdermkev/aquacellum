<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Species Profile — Aquacellum</title>
  <meta name="description" content="Detailed species care profile with tank parameters, diet, breeding guides, and ecology data — validated against FishBase.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/shared.css">

  <style>

    /* Species Hero */
    .species-hero {
      position: relative; z-index: 1;
      display: grid; grid-template-columns: 1fr 1fr; gap: 48px;
      padding: 40px 0 60px; align-items: center;
    }
    .hero-image-wrap {
      position: relative; border-radius: var(--radius-xl); overflow: hidden;
      aspect-ratio: 4/3; background: var(--bg-surface);
      border: 1px solid var(--glass-border);
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .hero-image-wrap img {
      width: 100%; height: 100%; object-fit: cover;
    }
    .hero-image-wrap .hero-video {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; object-fit: cover;
      z-index: 1; opacity: 0; transition: opacity 0.4s ease;
      pointer-events: none;
    }
    .hero-image-wrap .hero-video.playing {
      opacity: 1;
    }
    .hero-image-wrap .placeholder-icon {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 5rem; opacity: 0.3;
    }
    .hero-difficulty-badge {
      position: absolute; top: 16px; right: 16px;
      padding: 6px 14px; border-radius: 20px;
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.03em;
      backdrop-filter: blur(8px);
    }
    .badge-beginner { background: rgba(52,211,153,0.2); color: var(--emerald-300); border: 1px solid rgba(52,211,153,0.3); }
    .badge-intermediate { background: rgba(6,182,212,0.25); color: var(--cyan-300); border: 1px solid rgba(6,182,212,0.4); }
    .badge-advanced { background: rgba(251,113,133,0.2); color: var(--rose-400); border: 1px solid rgba(251,113,133,0.3); }
    .badge-difficult { background: rgba(167,139,250,0.2); color: var(--violet-400); border: 1px solid rgba(167,139,250,0.3); }
    .badge-unknown { background: rgba(255,255,255,0.1); color: var(--text-muted); border: 1px solid rgba(255,255,255,0.1); }

    /* Hero Info */
    .hero-info { display: flex; flex-direction: column; gap: 16px; }
    .hero-common-name {
      font-family: 'Outfit', sans-serif; font-weight: 900;
      font-size: clamp(2rem, 3.5vw, 2.8rem); line-height: 1.1;
      background: linear-gradient(135deg, var(--emerald-300), var(--teal-300));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .hero-sci-name { font-size: 1.1rem; font-style: italic; color: var(--emerald-400); }
    .hero-taxonomy {
      display: flex; gap: 16px; flex-wrap: wrap;
      font-size: 0.78rem; color: var(--text-muted);
    }
    .hero-taxonomy span { display: flex; align-items: center; gap: 4px; }
    .hero-taxonomy strong { color: var(--text-secondary); font-weight: 600; }
    .hero-vibe {
      font-size: 1rem; color: var(--text-secondary); line-height: 1.7;
      font-style: italic; border-left: 3px solid var(--emerald-500);
      padding-left: 16px; margin-top: 8px;
    }
    .hero-quick-stats {
      display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px;
    }
    .quick-stat {
      padding: 8px 14px; border-radius: 10px;
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
      display: flex; flex-direction: column; gap: 2px;
    }
    .quick-stat-label { font-size: 0.62rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
    .quick-stat-value { font-family: 'JetBrains Mono', monospace; font-size: 0.82rem; color: var(--text-primary); font-weight: 500; }

    /* Section styling */
    .content-sections { position: relative; z-index: 1; padding-bottom: 80px; }
    .section-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 32px;
      margin-bottom: 40px;
    }
    .section-card {
      background: var(--glass-bg); border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg); padding: 28px; backdrop-filter: blur(12px);
      transition: border-color 0.3s;
    }
    .section-card:hover { border-color: rgba(52,211,153,0.2); }
    .section-card.full-width { grid-column: 1 / -1; }
    .section-title {
      font-family: 'Outfit', sans-serif; font-weight: 700;
      font-size: 1.1rem; color: var(--text-primary); margin-bottom: 16px;
      display: flex; align-items: center; gap: 10px;
    }
    .section-title .icon { font-size: 1.2rem; }
    .section-text { font-size: 0.88rem; color: var(--text-secondary); line-height: 1.75; }
    .section-text strong { color: var(--text-primary); }

    /* Parameter Gauges */
    .gauge-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 16px; }
    .gauge-item { display: flex; flex-direction: column; gap: 8px; }
    .gauge-label { font-size: 0.72rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .gauge-track {
      height: 8px; border-radius: 4px; background: rgba(255,255,255,0.05);
      position: relative; overflow: hidden;
    }
    .gauge-fill {
      position: absolute; top: 0; left: 0; height: 100%; border-radius: 4px;
      background: linear-gradient(90deg, var(--emerald-500), var(--teal-400));
      transition: width 0.8s cubic-bezier(0.4,0,0.2,1);
    }
    .gauge-fill.warm { background: linear-gradient(90deg, var(--amber-400), var(--rose-400)); }
    .gauge-fill.neutral { background: linear-gradient(90deg, var(--cyan-400), var(--violet-400)); }
    .gauge-values {
      display: flex; justify-content: space-between;
      font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; color: var(--text-secondary);
    }

    /* Real-keeper marker — overlays a tick + label on a gauge-track showing
       the actual median reading logged by keepers of this species, distinct
       from the FishBase-sourced reference range rendered by gauge-fill. */
    .gauge-track.has-real-marker { overflow: visible; }
    .gauge-real-marker {
      position: absolute; top: -3px; bottom: -3px; width: 2px;
      background: #fff; border-radius: 1px; z-index: 2;
      box-shadow: 0 0 6px rgba(255,255,255,0.5);
      opacity: 0; transition: opacity 0.4s ease, left 0.8s cubic-bezier(0.4,0,0.2,1);
    }
    .gauge-real-marker.visible { opacity: 1; }
    .gauge-real-marker::after {
      content: attr(data-tip);
      position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
      margin-bottom: 5px; padding: 3px 7px; border-radius: 6px;
      background: rgba(15,20,30,0.95); border: 1px solid rgba(255,255,255,0.15);
      font-size: 0.62rem; font-weight: 600; color: #fff; white-space: nowrap;
      font-family: 'JetBrains Mono', monospace; pointer-events: none;
    }
    .gauge-real-note {
      display: flex; align-items: center; gap: 5px; margin-top: 2px;
      font-size: 0.66rem; color: var(--text-muted);
    }
    .gauge-real-note .dot { width: 6px; height: 6px; border-radius: 50%; background: #fff; flex-shrink: 0; }
    .gauge-real-note .dot.spawn { background: var(--emerald-400, #34d399); }

    /* Compatibility mini-cards */
    .compat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-top: 12px; }
    .compat-chip {
      padding: 10px 14px; border-radius: 10px;
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
      font-size: 0.78rem; color: var(--text-secondary); text-align: center;
      transition: var(--transition);
    }
    .compat-chip.good { border-color: rgba(52,211,153,0.25); background: rgba(52,211,153,0.05); }
    .compat-chip.caution { border-color: rgba(251,191,36,0.25); background: rgba(251,191,36,0.05); }
    .compat-chip.avoid { border-color: rgba(251,113,133,0.25); background: rgba(251,113,133,0.05); }

    /* FishBase link */
    .source-link {
      display: inline-flex; align-items: center; gap: 6px;
      margin-top: 16px; padding: 8px 16px; border-radius: 8px;
      font-size: 0.78rem; font-weight: 600; color: var(--emerald-300);
      background: rgba(16,185,129,0.08); border: 1px solid rgba(16,185,129,0.2);
      transition: var(--transition);
    }
    .source-link:hover { background: rgba(16,185,129,0.15); transform: translateY(-1px); }



    /* Responsive */
    @media (max-width: 900px) {
      .species-hero { grid-template-columns: 1fr; gap: 32px; }
      .section-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 768px) {
      .hero-common-name { font-size: 1.8rem; }
      .gauge-row { grid-template-columns: 1fr; }
      .marketplace-listings { grid-template-columns: 1fr; }
      .related-scroll { gap: 12px; }
    }

    /* =========================================
       MARKETPLACE CROSS-LINK SECTION
    ========================================= */
    .marketplace-section { margin-top: 40px; padding: 28px; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: var(--radius-lg); }
    .marketplace-section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .marketplace-section-title { font-family: 'Outfit', sans-serif; font-size: 1rem; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 8px; }
    .marketplace-section-link { font-size: 0.72rem; font-weight: 600; color: var(--emerald-400); transition: color 0.2s; }
    .marketplace-section-link:hover { color: var(--emerald-300); }
    .marketplace-listings { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
    .mp-listing-card { padding: 14px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: var(--radius-sm); transition: var(--transition); cursor: pointer; }
    .mp-listing-card:hover { border-color: rgba(52,211,153,0.25); background: rgba(52,211,153,0.03); }
    .mp-listing-name { font-family: 'Outfit', sans-serif; font-size: 0.82rem; font-weight: 700; color: #fff; margin-bottom: 4px; }
    .mp-listing-price { font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; font-weight: 700; color: var(--emerald-300); margin-bottom: 6px; }
    .mp-listing-meta { font-size: 0.62rem; color: var(--text-muted); }
    .mp-empty { font-size: 0.82rem; color: var(--text-muted); text-align: center; padding: 20px; }

    /* =========================================
       RELATED SPECIES SECTION
    ========================================= */
    .related-section { margin-top: 32px; }
    .related-section-title { font-family: 'Outfit', sans-serif; font-size: 1rem; font-weight: 700; color: #fff; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    .related-scroll { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 12px; scrollbar-width: thin; scrollbar-color: rgba(139,92,246,0.2) transparent; }
    .related-scroll::-webkit-scrollbar { height: 4px; }
    .related-scroll::-webkit-scrollbar-thumb { background: rgba(139,92,246,0.3); border-radius: 4px; }
    .related-card { flex-shrink: 0; width: 180px; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: var(--radius-sm); overflow: hidden; cursor: pointer; transition: var(--transition); }
    .related-card:hover { border-color: rgba(52,211,153,0.3); transform: translateY(-2px); }
    .related-card-img { width: 100%; height: 100px; object-fit: cover; background: rgba(0,0,0,0.2); }
    .related-card-info { padding: 10px 12px; }
    .related-card-name { font-family: 'Outfit', sans-serif; font-size: 0.78rem; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .related-card-sci { font-size: 0.62rem; font-style: italic; color: var(--emerald-400); }

    /* Enhanced species sections */
    .enhanced-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 16px; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.04em; background: rgba(52,211,153,0.1); border: 1px solid rgba(52,211,153,0.25); color: var(--emerald-300); margin-bottom: 16px; }

    /* Table of Contents */
    .toc-nav { margin-bottom: 24px; padding: 14px 20px; border-radius: 12px; background: var(--glass-bg); border: 1px solid var(--glass-border); backdrop-filter: blur(8px); position: sticky; top: 72px; z-index: 5; }
    .toc-title { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); margin-bottom: 8px; }
    .toc-links { display: flex; flex-wrap: wrap; gap: 6px; }
    .toc-links a { padding: 5px 12px; border-radius: 6px; font-size: 0.72rem; font-weight: 600; color: var(--text-secondary); background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); text-decoration: none; transition: all 0.2s; }
    .toc-links a:hover { color: var(--emerald-300); border-color: rgba(52,211,153,0.3); background: rgba(52,211,153,0.06); }
    .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 12px; }
    .info-item { padding: 12px; border-radius: 10px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); }
    .info-item-label { font-size: 0.62rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
    .info-item-value { font-size: 0.82rem; color: var(--text-primary); font-weight: 500; }
    .disease-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; }
    .disease-card { border-radius: 10px; background: rgba(251,113,133,0.04); border: 1px solid rgba(251,113,133,0.12); overflow: hidden; }
    .disease-card:last-child { margin-bottom: 0; }
    .disease-card-inner { display: flex; gap: 14px; padding: 14px; }
    .disease-img { width: 80px; height: 80px; border-radius: 8px; object-fit: cover; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.06); }
    .disease-text { flex: 1; min-width: 0; }
    .disease-name { font-size: 0.85rem; font-weight: 700; color: var(--text-primary); margin-bottom: 4px; }
    .disease-cause { font-size: 0.72rem; color: var(--rose-400); margin-bottom: 6px; }
    .disease-notes { font-size: 0.78rem; color: var(--text-secondary); line-height: 1.6; }
    .tankmate-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; margin-bottom: 6px; font-size: 0.82rem; transition: border-color 0.2s, transform 0.15s; }
    .tankmate-row:last-child { margin-bottom: 0; }
    .tankmate-row:hover { transform: translateX(3px); }
    .tankmate-row.good { background: rgba(52,211,153,0.06); border: 1px solid rgba(52,211,153,0.12); }
    .tankmate-row.good:hover { border-color: rgba(52,211,153,0.3); }
    .tankmate-row.bad { background: rgba(251,113,133,0.06); border: 1px solid rgba(251,113,133,0.12); }
    .tankmate-row.bad:hover { border-color: rgba(251,113,133,0.3); }
    .tankmate-icon { font-size: 1rem; flex-shrink: 0; }
    .tankmate-species { font-weight: 600; color: var(--text-primary); }
    .tankmate-note { font-size: 0.72rem; color: var(--text-muted); margin-top: 2px; }
    .variant-chip { display: inline-flex; padding: 6px 12px; border-radius: 8px; font-size: 0.75rem; font-weight: 600; background: rgba(167,139,250,0.08); border: 1px solid rgba(167,139,250,0.15); color: var(--violet-400); margin: 4px; }
    .color-chip { display: inline-flex; padding: 4px 10px; border-radius: 6px; font-size: 0.7rem; font-weight: 500; background: rgba(34,211,238,0.06); border: 1px solid rgba(34,211,238,0.12); color: var(--cyan-300); margin: 3px; }
    .country-chip { display: inline-flex; padding: 4px 10px; border-radius: 6px; font-size: 0.7rem; font-weight: 500; background: rgba(52,211,153,0.06); border: 1px solid rgba(52,211,153,0.12); color: var(--emerald-400); margin: 3px; }
    .iucn-badge { display: inline-flex; padding: 4px 10px; border-radius: 6px; font-size: 0.7rem; font-weight: 700; }
    .iucn-vu { background: rgba(251,191,36,0.15); border: 1px solid rgba(251,191,36,0.3); color: #fbbf24; }
    .iucn-lc { background: rgba(52,211,153,0.15); border: 1px solid rgba(52,211,153,0.3); color: #34d399; }
    .iucn-en { background: rgba(251,113,133,0.15); border: 1px solid rgba(251,113,133,0.3); color: #fb7185; }
    .sex-compare { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 12px; }
    .sex-col { padding: 16px; border-radius: 10px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06); }
    .sex-col-title { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
    .sex-col-text { font-size: 0.8rem; color: var(--text-secondary); line-height: 1.65; }

    /* Color gallery */
    .color-gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-top: 12px; }
    .color-gallery-item { position: relative; border-radius: 12px; overflow: hidden; aspect-ratio: 4/3; border: 1px solid rgba(255,255,255,0.06); }
    .color-gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
    .color-gallery-item:hover img { transform: scale(1.05); }
    .color-gallery-label { position: absolute; bottom: 0; left: 0; right: 0; padding: 8px 12px; font-size: 0.72rem; font-weight: 600; color: #fff; background: linear-gradient(transparent, rgba(0,0,0,0.8)); }

    /* Timeline */
    .timeline { position: relative; padding-left: 24px; margin-top: 12px; }
    .timeline::before { content: ''; position: absolute; left: 7px; top: 4px; bottom: 4px; width: 2px; background: rgba(52,211,153,0.2); border-radius: 1px; }
    .timeline-item { position: relative; margin-bottom: 16px; display: flex; gap: 12px; align-items: flex-start; }
    .timeline-item:last-child { margin-bottom: 0; }
    .timeline-dot { position: absolute; left: -20px; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--emerald-400); border: 2px solid var(--bg-deep); flex-shrink: 0; }
    .timeline-content { flex: 1; }
    .timeline-age { font-size: 0.75rem; font-weight: 700; color: var(--emerald-300); margin-bottom: 3px; }
    .timeline-milestone { font-size: 0.8rem; color: var(--text-secondary); line-height: 1.6; }

    /* Myths */
    .myth-card { margin-bottom: 14px; padding: 14px; border-radius: 10px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06); }
    .myth-card:last-child { margin-bottom: 0; }
    .myth-row { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 8px; }
    .myth-icon { color: var(--rose-400); font-size: 0.9rem; flex-shrink: 0; margin-top: 1px; }
    .myth-text { font-size: 0.82rem; color: var(--text-muted); line-height: 1.5; }
    .reality-row { display: flex; gap: 10px; align-items: flex-start; padding-left: 4px; }
    .reality-icon { color: var(--emerald-400); font-size: 0.9rem; flex-shrink: 0; margin-top: 1px; }
    .reality-text { font-size: 0.82rem; color: var(--text-secondary); line-height: 1.5; }

    /* Enrichment */
    .enrichment-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 10px; margin-top: 12px; }
    .enrichment-item { padding: 12px; border-radius: 8px; background: rgba(52,211,153,0.04); border: 1px solid rgba(52,211,153,0.1); }
    .enrichment-title { font-size: 0.78rem; font-weight: 700; color: var(--emerald-300); margin-bottom: 4px; }
    .enrichment-desc { font-size: 0.76rem; color: var(--text-secondary); line-height: 1.55; }

    /* Sources */
    .sources-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    .source-item { padding: 10px 16px; border-radius: 8px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.08); text-decoration: none; transition: border-color 0.2s, transform 0.15s; }
    .source-item:hover { border-color: rgba(52,211,153,0.3); transform: translateY(-2px); }
    .source-name { font-size: 0.78rem; font-weight: 700; color: var(--text-primary); }
    .source-type { font-size: 0.65rem; color: var(--text-muted); margin-top: 2px; }

    /* Educational Videos (inline) */
    .inline-video { border-radius: 10px; overflow: hidden; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06); }
    .video-embed { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; }
    .video-embed iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    .video-info { padding: 10px 14px; }
    .video-title { font-size: 0.75rem; font-weight: 600; color: var(--text-primary); line-height: 1.4; }
    .video-meta { font-size: 0.65rem; color: var(--text-muted); margin-top: 3px; }

    /* ── Community Voice (distinct from verified encyclopedia data) ────────── */
    .community-block { margin-top: 18px; padding-top: 16px; border-top: 1px dashed rgba(139,180,255,0.18); }
    .community-block-label { display: flex; align-items: center; gap: 7px; font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #8bb4ff; margin-bottom: 12px; }
    .community-block-label::before { content: '👥'; font-size: 0.8rem; }
    .community-voice { display: flex; gap: 12px; padding: 13px 15px; border-radius: 12px; background: rgba(96,140,255,0.05); border: 1px solid rgba(96,140,255,0.14); border-left: 3px solid #6c8cff; margin-bottom: 10px; }
    .community-voice:last-child { margin-bottom: 0; }
    .cv-avatar { width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0; object-fit: cover; background: linear-gradient(135deg, #6c8cff, #a78bfa); display: flex; align-items: center; justify-content: center; font-size: 1rem; font-weight: 700; color: #fff; }
    .cv-body { flex: 1; min-width: 0; }
    .cv-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }
    .cv-name { font-size: 0.8rem; font-weight: 700; color: #cdd9ff; }
    .cv-tier { font-size: 0.58rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; padding: 2px 7px; border-radius: 10px; background: rgba(167,139,250,0.15); border: 1px solid rgba(167,139,250,0.3); color: #c4b5fd; }
    .cv-tag { font-size: 0.58rem; font-weight: 600; padding: 2px 7px; border-radius: 10px; background: rgba(96,140,255,0.12); color: #8bb4ff; }
    .cv-text { font-size: 0.82rem; color: var(--text-secondary); line-height: 1.6; font-style: italic; }
    .cv-footer { display: flex; align-items: center; gap: 14px; margin-top: 8px; }
    .cv-vote { display: flex; align-items: center; gap: 5px; font-size: 0.7rem; color: var(--text-muted); background: none; border: none; cursor: pointer; padding: 0; transition: color 0.2s; }
    .cv-vote:hover { color: #8bb4ff; }
    .cv-add { display: inline-flex; align-items: center; gap: 6px; margin-top: 4px; padding: 8px 14px; border-radius: 8px; font-size: 0.72rem; font-weight: 600; color: #8bb4ff; background: rgba(96,140,255,0.06); border: 1px dashed rgba(96,140,255,0.25); text-decoration: none; cursor: pointer; transition: all 0.2s; }
    .cv-add:hover { background: rgba(96,140,255,0.12); border-color: rgba(96,140,255,0.4); }
    .cv-time { font-size: 0.66rem; color: var(--text-muted); }
    .cv-vote.voted { color: #6c8cff; font-weight: 700; }
    .cv-vote-pop { animation: votePop 0.4s ease; }
    @keyframes votePop { 0% { transform: scale(1); } 40% { transform: scale(1.35); } 100% { transform: scale(1); } }
    /* Card entrance */
    .community-voice { opacity: 0; transform: translateY(8px); animation: cvIn 0.5s ease forwards; }
    @keyframes cvIn { to { opacity: 1; transform: translateY(0); } }
    .community-voice.rotating-out { animation: cvOut 0.4s ease forwards; }
    @keyframes cvOut { to { opacity: 0; transform: translateY(-8px); } }

    /* Live community pulse */
    .community-pulse { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; padding: 10px 14px; border-radius: 10px; background: rgba(96,140,255,0.05); border: 1px solid rgba(96,140,255,0.12); }
    .pulse-dot { width: 8px; height: 8px; border-radius: 50%; background: #34d399; box-shadow: 0 0 0 rgba(52,211,153,0.6); animation: pulseGlow 2s infinite; flex-shrink: 0; }
    @keyframes pulseGlow { 0% { box-shadow: 0 0 0 0 rgba(52,211,153,0.5); } 70% { box-shadow: 0 0 0 8px rgba(52,211,153,0); } 100% { box-shadow: 0 0 0 0 rgba(52,211,153,0); } }
    .pulse-stat { display: flex; align-items: baseline; gap: 5px; font-size: 0.74rem; color: var(--text-secondary); }
    .pulse-num { font-family: 'JetBrains Mono', monospace; font-weight: 700; color: #cdd9ff; font-size: 0.85rem; }
    .pulse-sep { color: rgba(255,255,255,0.12); }

    /* Mobile responsive */
    @media (max-width: 768px) {
      .species-hero { grid-template-columns: 1fr; gap: 24px; padding: 24px 0 40px; }
      .section-grid { grid-template-columns: 1fr; }
      .sex-compare { grid-template-columns: 1fr; }
      .toc-nav { position: relative; top: 0; }
      .toc-links { gap: 4px; }
      .toc-links a { padding: 4px 8px; font-size: 0.65rem; }
      .disease-grid { grid-template-columns: 1fr; }
      .color-gallery { grid-template-columns: 1fr 1fr; }
      .enrichment-grid { grid-template-columns: 1fr; }
    }

    /* =========================================
       COMMUNITY SECTIONS (Tank Posts, Breeders, Schools, Tides)
    ========================================= */
    .species-community-sections { margin-top: 40px; display: flex; flex-direction: column; gap: 28px; }
    .community-section-card { padding: 24px 28px; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: var(--radius-lg); backdrop-filter: blur(12px); }
    .community-section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .community-section-title { font-family: 'Outfit', sans-serif; font-size: 1rem; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 8px; margin: 0; }
    .community-section-count { font-size: 0.68rem; font-weight: 600; color: var(--text-muted); padding: 3px 10px; border-radius: 12px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); }
    .community-section-empty { font-size: 0.82rem; color: var(--text-muted); text-align: center; padding: 16px; margin: 0; }
    .community-section-empty a { color: var(--emerald-400); text-decoration: none; }
    .community-section-empty a:hover { text-decoration: underline; }
    .community-section-link { display: inline-flex; align-items: center; gap: 5px; margin-top: 12px; font-size: 0.75rem; font-weight: 600; color: var(--emerald-400); text-decoration: none; transition: color 0.2s; }
    .community-section-link:hover { color: var(--emerald-300); }

    /* Tank Posts Grid */
    .tank-posts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
    .tank-post-card { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; overflow: hidden; transition: border-color 0.2s, transform 0.15s; }
    .tank-post-card:hover { border-color: rgba(56,189,248,0.25); transform: translateY(-2px); }
    .tp-media { width: 100%; height: 140px; overflow: hidden; }
    .tp-media img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
    .tank-post-card:hover .tp-media img { transform: scale(1.04); }
    .tp-body { padding: 12px 14px; }
    .tp-author { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
    .tp-avatar { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .tp-avatar-fallback { background: linear-gradient(135deg, #38bdf8, #0ea5e9); display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 700; color: #fff; }
    .tp-name { font-size: 0.75rem; font-weight: 600; color: var(--text-primary); }
    .tp-section-badge { font-size: 0.58rem; font-weight: 700; padding: 2px 7px; border-radius: 10px; background: rgba(56,189,248,0.1); border: 1px solid rgba(56,189,248,0.25); color: #38bdf8; text-transform: capitalize; }
    .tp-time { font-size: 0.62rem; color: var(--text-muted); margin-left: auto; }
    .tp-text { font-size: 0.78rem; color: var(--text-secondary); line-height: 1.55; margin: 0; }

    /* Breeders Grid */
    .breeders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
    .breeder-card { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 10px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06); text-decoration: none; transition: border-color 0.2s, transform 0.15s; }
    .breeder-card:hover { border-color: rgba(251,191,36,0.3); transform: translateY(-1px); }
    .breeder-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .breeder-avatar-fallback { background: linear-gradient(135deg, #fbbf24, #f59e0b); display: flex; align-items: center; justify-content: center; font-size: 0.9rem; font-weight: 700; color: #fff; }
    .breeder-info { flex: 1; min-width: 0; }
    .breeder-name { font-size: 0.8rem; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .master-badge { font-size: 0.58rem; font-weight: 700; padding: 2px 7px; border-radius: 10px; background: rgba(251,191,36,0.15); border: 1px solid rgba(251,191,36,0.3); color: #fbbf24; }
    .tier-badge { font-size: 0.55rem; font-weight: 600; padding: 2px 6px; border-radius: 8px; background: rgba(167,139,250,0.1); border: 1px solid rgba(167,139,250,0.2); color: #c4b5fd; }
    .breeder-specs { font-size: 0.68rem; color: var(--text-muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Schools Grid */
    .schools-grid { display: flex; flex-wrap: wrap; gap: 10px; }
    .school-chip { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 12px; background: rgba(139,92,246,0.05); border: 1px solid rgba(139,92,246,0.15); text-decoration: none; transition: border-color 0.2s, transform 0.15s; }
    .school-chip:hover { border-color: rgba(139,92,246,0.35); transform: translateY(-1px); }
    .school-avatar { width: 32px; height: 32px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
    .school-avatar-fallback { background: linear-gradient(135deg, #8b5cf6, #6d28d9); display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 700; color: #fff; border-radius: 8px; }
    .school-chip-info { display: flex; flex-direction: column; gap: 2px; }
    .school-chip-name { font-size: 0.78rem; font-weight: 700; color: var(--text-primary); }
    .school-chip-members { font-size: 0.62rem; color: var(--text-muted); }

    /* Tides Grid */
    .tides-grid { display: flex; flex-direction: column; gap: 10px; }
    .tide-event-card { display: flex; gap: 14px; padding: 14px 16px; border-radius: 12px; background: rgba(6,182,212,0.04); border: 1px solid rgba(6,182,212,0.12); transition: border-color 0.2s, transform 0.15s; }
    .tide-event-card:hover { border-color: rgba(6,182,212,0.3); transform: translateX(3px); }
    .tide-date-col { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 48px; padding: 8px; border-radius: 10px; background: rgba(6,182,212,0.1); }
    .tide-month { font-size: 0.58rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--cyan-300); }
    .tide-day { font-size: 1.2rem; font-weight: 800; color: #fff; line-height: 1; }
    .tide-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .tide-title { font-size: 0.85rem; font-weight: 700; color: var(--text-primary); }
    .tide-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .tide-type-badge { font-size: 0.6rem; font-weight: 700; padding: 2px 8px; border-radius: 8px; background: rgba(6,182,212,0.12); border: 1px solid rgba(6,182,212,0.25); color: var(--cyan-300); text-transform: capitalize; }
    .tide-location { font-size: 0.68rem; color: var(--text-secondary); }
    .tide-time { font-size: 0.68rem; color: var(--text-muted); }
    .tide-rsvp { font-size: 0.68rem; color: var(--emerald-400); font-weight: 600; }

    /* Community sections responsive */
    @media (max-width: 768px) {
      .species-community-sections { margin-top: 28px; gap: 20px; }
      .community-section-card { padding: 16px 18px; }
      .tank-posts-grid { grid-template-columns: 1fr; }
      .breeders-grid { grid-template-columns: 1fr; }
      .schools-grid { gap: 8px; }
      .school-chip { padding: 8px 12px; }
      .tide-event-card { padding: 10px 12px; gap: 10px; }
    }
  </style>
</head>
<body>
  <!-- Ambient Background -->
  <div class="ambient-layer">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- Navigation -->
  <header id="site-nav"></header>

  <!-- Main Content (populated by JS) -->
  <main class="container" id="mainContent">
    <div class="loading-state">
      <div class="spinner"></div>
      <p>Loading species data...</p>
    </div>
  </main>

  <!-- Footer -->
  <footer id="site-footer"></footer>

  <!-- Loaded before the inline script below so AquadexPublicListings is defined
       when the listing/breeder sections fetch (Fish Finder T14). -->
  <script src="/js/public-listings.js"></script>
  <script>
    // Utility: generate slug from scientific name
    function toSlug(name) {
      return name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
    }

    // Utility: get difficulty badge class
    function getBadgeClass(diff) {
      if (!diff) return 'badge-unknown';
      const d = diff.toLowerCase();
      if (d === 'beginner') return 'badge-beginner';
      if (d === 'intermediate') return 'badge-intermediate';
      if (d === 'advanced') return 'badge-advanced';
      if (d === 'difficult') return 'badge-difficult';
      return 'badge-unknown';
    }

    // Utility: check for placeholder values
    function real(val) {
      return val && val !== 'Information arriving soon' && val !== 'Generic Biotope Details' ? val : null;
    }

    // Gauge helper: map a value range to percentage within an absolute scale
    function rangeToPercent(min, max, absMin, absMax) {
      const span = absMax - absMin;
      const left = ((min - absMin) / span) * 100;
      const width = ((max - min) / span) * 100;
      return { left: Math.max(0, left), width: Math.min(100 - left, width) };
    }

    let allSpecies = [];

    async function init() {
      // Extract slug from URL path
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      // Expected: /species/{slug}
      const slug = pathParts.length >= 2 ? pathParts[pathParts.length - 1] : null;

      if (!slug) {
        showError('No species specified. <a href="/database.html">Browse the database</a>.');
        return;
      }

      try {
        const res = await fetch('/fishbase_master.json?v=2');
        if (!res.ok) throw new Error('Failed to load species data');
        allSpecies = await res.json();

        // Find species by slug match on scientific name or common name
        const species = allSpecies.find(sp => {
          return toSlug(sp.scientificName) === slug || toSlug(sp.commonName || '') === slug;
        });

        if (!species) {
          showError(`Species "${slug}" not found. <a href="/database.html">Browse the database</a>.`);
          return;
        }

        // Update page title
        document.title = `${species.commonName || species.scientificName} — Aquacellum Species Profile`;
        const metaDesc = document.querySelector('meta[name="description"]');
        if (metaDesc) {
          metaDesc.content = `Complete care profile for ${species.commonName || species.scientificName} (${species.scientificName}). Tank parameters, diet, breeding, and ecology data.`;
        }

        renderSpecies(species);
      } catch (err) {
        showError('Failed to load species data. Please try refreshing.');
      }
    }

    function showError(message) {
      document.getElementById('mainContent').innerHTML = `
        <div class="loading-state">
          <p style="font-size:1.1rem; color: var(--text-secondary);">${message}</p>
        </div>`;
    }

    function renderSpecies(sp) {
      // Helper: render inline video for a section if one exists
      function inlineVideo(sectionKey) {
        if (!sp.educationalVideos?.length) return '';
        const vid = sp.educationalVideos.find(v => v.section === sectionKey);
        if (!vid) return '';
        return `<div class="inline-video" style="margin-top:16px;">
          <div class="video-embed"><iframe src="https://www.youtube.com/embed/${vid.youtubeId}" title="${vid.title}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>
          <div class="video-info"><div class="video-title">${vid.title}</div><div class="video-meta">${vid.channel}</div></div>
        </div>`;
      }

      // Helper: render a community-slot placeholder that gets hydrated async
      // from species_insights. Distinct visual voice from verified data.
      function communitySlot(category, prompt) {
        return `<div class="community-slot" data-category="${category}" data-prompt="${prompt}"></div>`;
      }

      const difficulty = sp.tankMetrics?.difficulty || 'Unknown';
      const badgeClass = getBadgeClass(difficulty);
      const hasImage = sp.masterPhotoUrl && sp.masterPhotoUrl !== '';
      const temp = sp.tankMetrics?.tempRangeCelsius;
      const ph = sp.tankMetrics?.phRange;
      const videoSlug = sp.scientificName.toLowerCase().replace(/\s+/g, '-');
      const videoPath = `/videos/species/${videoSlug}.mp4`;

      // Build the hero image
      const imageHtml = hasImage
        ? `<img src="${sp.masterPhotoUrl}" alt="${sp.commonName || sp.scientificName}" loading="eager"><video class="hero-video" src="${videoPath}" muted loop playsinline preload="metadata"></video>`
        : `<div class="placeholder-icon">🐟</div>`;

      // Vibe line
      const vibe = sp.personality?.flavorText?.casual || sp.personality?.vibeLine?.casual || '';

      // Quick stats
      const quickStats = [];
      if (temp) quickStats.push({ label: 'Temp', value: `${temp[0]}–${temp[1]}°C` });
      if (ph) quickStats.push({ label: 'pH', value: `${ph[0]}–${ph[1]}` });
      if (sp.maxLengthCm) quickStats.push({ label: 'Max Size', value: `${sp.maxLengthCm} cm` });
      if (sp.tankMetrics?.minVolumeGallons) quickStats.push({ label: 'Min Tank', value: `${sp.tankMetrics.minVolumeGallons} gal` });
      if (sp.ecology?.hardnessRange) quickStats.push({ label: 'Hardness', value: sp.ecology.hardnessRange });

      let html = `
        <!-- Breadcrumb -->
        <div class="breadcrumb">
          <a href="/">Home</a> <span class="sep">›</span>
          <a href="/database.html">Database</a> <span class="sep">›</span>
          <span>${sp.commonName || sp.scientificName}</span>
        </div>

        <!-- Hero -->
        <section class="species-hero">
          <div class="hero-image-wrap">
            ${imageHtml}
            <span class="hero-difficulty-badge ${badgeClass}">${difficulty}</span>
          </div>
          <div class="hero-info">
            <h1 class="hero-common-name">${sp.commonName || 'Unknown Species'}</h1>
            <p class="hero-sci-name">${sp.scientificName}</p>
            <div class="hero-taxonomy">
              <span><strong>Family:</strong> ${sp.family || '—'}</span>
              <span><strong>Genus:</strong> ${sp.genus || '—'}</span>
              <span><strong>SpecCode:</strong> ${sp.specCode || '—'}</span>
            </div>
            ${vibe ? `<blockquote class="hero-vibe">${vibe}</blockquote>` : ''}
            <div class="hero-quick-stats">
              ${quickStats.map(s => `
                <div class="quick-stat">
                  <span class="quick-stat-label">${s.label}</span>
                  <span class="quick-stat-value">${s.value}</span>
                </div>`).join('')}
            </div>
          </div>
        </section>
      `;

      // Content sections
      html += `<div class="content-sections"><div class="section-grid">`;

      // 1. Tank Parameters with gauges
      if (temp || ph || sp.ecology?.hardnessRange) {
        html += `
          <div class="section-card">
            <h2 class="section-title"><span class="icon">🌡️</span> Tank Parameters</h2>
            <div class="gauge-row">`;

        if (temp) {
          const tPct = rangeToPercent(temp[0], temp[1], 15, 35);
          html += `
              <div class="gauge-item">
                <span class="gauge-label">Temperature</span>
                <div class="gauge-track" id="gauge-track-temp" data-abs-min="15" data-abs-max="35">
                  <div class="gauge-fill warm" style="left:${tPct.left}%; width:${tPct.width}%"></div>
                </div>
                <div class="gauge-values"><span>${temp[0]}°C</span><span>${temp[1]}°C</span></div>
              </div>`;
        }

        if (ph) {
          const pPct = rangeToPercent(ph[0], ph[1], 5, 9.5);
          html += `
              <div class="gauge-item">
                <span class="gauge-label">pH Range</span>
                <div class="gauge-track" id="gauge-track-ph" data-abs-min="5" data-abs-max="9.5">
                  <div class="gauge-fill neutral" style="left:${pPct.left}%; width:${pPct.width}%"></div>
                </div>
                <div class="gauge-values"><span>${ph[0]}</span><span>${ph[1]}</span></div>
              </div>`;
        }

        if (sp.tankMetrics?.minVolumeGallons) {
          const vPct = Math.min((sp.tankMetrics.minVolumeGallons / 150) * 100, 100);
          html += `
              <div class="gauge-item">
                <span class="gauge-label">Minimum Volume</span>
                <div class="gauge-track">
                  <div class="gauge-fill" style="left:0%; width:${vPct}%"></div>
                </div>
                <div class="gauge-values"><span>${sp.tankMetrics.minVolumeGallons} gal</span><span>150 gal</span></div>
              </div>`;
        }

        if (sp.maxLengthCm) {
          const sPct = Math.min((sp.maxLengthCm / 40) * 100, 100);
          html += `
              <div class="gauge-item">
                <span class="gauge-label">Max Adult Size</span>
                <div class="gauge-track">
                  <div class="gauge-fill" style="left:0%; width:${sPct}%"></div>
                </div>
                <div class="gauge-values"><span>${sp.maxLengthCm} cm</span><span>40 cm</span></div>
              </div>`;
        }

        html += `</div></div>`;
      }

      // 2. Ecology & Habitat
      const biotope = real(sp.ecology?.biotope);
      const socialBehavior = real(sp.ecology?.socialBehavior);
      const ecoComments = real(sp.ecology?.comments);

      if (biotope || socialBehavior || ecoComments) {
        html += `
          <div class="section-card">
            <h2 class="section-title"><span class="icon">🌿</span> Ecology & Habitat</h2>
            <div class="section-text">
              ${ecoComments ? `<p>${ecoComments}</p>` : ''}
              ${biotope ? `<p style="margin-top:12px;"><strong>Natural Habitat:</strong> ${biotope}</p>` : ''}
              ${socialBehavior ? `<p style="margin-top:12px;"><strong>Social Behavior:</strong> ${socialBehavior}</p>` : ''}
            </div>
          </div>`;
      }

      // 3. Diet & Feeding
      const fooditems = real(sp.diet?.fooditems);
      const feedingPlaybook = real(sp.diet?.feedingPlaybook);
      const trophicLevel = sp.diet?.trophicLevel;

      if (trophicLevel || fooditems || feedingPlaybook) {
        html += `
          <div class="section-card">
            <h2 class="section-title"><span class="icon">🍽️</span> Diet & Feeding</h2>
            <div class="section-text">
              ${trophicLevel ? `<p><strong>Trophic Level:</strong> ${trophicLevel}</p>` : ''}
              ${fooditems ? `<p style="margin-top:12px;"><strong>Recommended Foods:</strong> ${fooditems}</p>` : ''}
              ${feedingPlaybook ? `<p style="margin-top:12px;"><strong>Feeding Guide:</strong> ${feedingPlaybook}</p>` : ''}
            </div>
          </div>`;
      }

      // 4. Reproduction & Breeding
      const spawningTrait = real(sp.reproduction?.spawningTrait);
      const layoutReq = real(sp.reproduction?.layoutRequirement);

    // Infer compatibility traits from available data
    function inferCompatibility(sp) {
      const chips = [];
      const social = (sp.ecology?.socialBehavior || '').toLowerCase();
      const difficulty = (sp.tankMetrics?.difficulty || '').toLowerCase();
      const maxSize = sp.maxLengthCm || 0;

      // Temperament-based
      if (social.includes('peaceful') || social.includes('community')) {
        chips.push({ type: 'good', icon: '✓', label: 'Community-friendly' });
      }
      if (social.includes('schooling') || social.includes('group') || social.includes('shoal')) {

    // Relative time: "3 days ago", "2h ago", "just now"
    function relativeTime(iso) {
      if (!iso) return '';
      const diff = Date.now() - new Date(iso).getTime();
      const mins = Math.floor(diff / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return `${mins}m ago`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return `${hrs}h ago`;
      const days = Math.floor(hrs / 24);
      if (days < 7) return `${days}d ago`;
      const wks = Math.floor(days / 7);
      if (wks < 5) return `${wks}w ago`;
      const mos = Math.floor(days / 30);
      return `${mos}mo ago`;
    }

    // ── Real Keeper Field Stats ────────────────────────────────────────────
    // Overlays real median temp/pH (from logged tank parameters) on top of
    // the FishBase reference-range gauges, and surfaces real spawn activity.
    // Distinct from the reference range: this is what keepers are *actually*
    // running, not the textbook range. Calls get_species_field_stats(), a
    // SECURITY DEFINER RPC that only ever returns aggregate numbers (never a
    // raw per-user row) and nulls out any stat built from fewer than 3 tanks.
    async function renderRealKeeperStats(sp) {
      const gaugeRow = document.querySelector('.gauge-row');
      if (!gaugeRow || !sp.scientificName) return;

      let stats = null;
      try {
        const res = await fetch(`${SB_URL}/rest/v1/rpc/get_species_field_stats`, {
          method: 'POST',
          headers: { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ p_scientific_name: sp.scientificName })
        });
        if (res.ok) {
          const rows = await res.json();
          stats = Array.isArray(rows) ? rows[0] : rows;
        }
      } catch (e) { /* silent */ }

      if (!stats) return;

      function placeMarker(trackId, rawValue, tipFn) {
        const value = rawValue == null ? null : Number(rawValue);
        if (value == null || Number.isNaN(value)) return;
        const track = document.getElementById(trackId);
        if (!track) return;
        const absMin = parseFloat(track.dataset.absMin);
        const absMax = parseFloat(track.dataset.absMax);
        const pct = Math.max(0, Math.min(100, ((value - absMin) / (absMax - absMin)) * 100));
        const marker = document.createElement('div');
        marker.className = 'gauge-real-marker';
        marker.style.left = `${pct}%`;
        marker.dataset.tip = tipFn(value);
        track.classList.add('has-real-marker');
        track.appendChild(marker);
        // Double rAF so the opacity transition actually plays on insert
        requestAnimationFrame(() => requestAnimationFrame(() => marker.classList.add('visible')));
      }

      placeMarker('gauge-track-temp', stats.median_temp_c, (v) => `Keepers: ${v}°C`);
      placeMarker('gauge-track-ph', stats.median_ph, (v) => `Keepers: ${v} pH`);

      let lastEl = gaugeRow;
      const sampleSize = Number(stats.tank_sample_size) || 0;

      if ((stats.median_temp_c != null || stats.median_ph != null) && sampleSize > 0) {
        const note = document.createElement('div');
        note.className = 'gauge-real-note';
        note.innerHTML = `<span class="dot"></span> White marker = real median logged by ${sampleSize} keeper tank${sampleSize === 1 ? '' : 's'} housing this species`;
        lastEl.insertAdjacentElement('afterend', note);
        lastEl = note;
      }

      const spawnsTotal = Number(stats.spawns_total) || 0;
      if (spawnsTotal > 0) {
        const spawns30d = Number(stats.spawns_30d) || 0;
        const avgOffspring = stats.avg_offspring_count == null ? null : Number(stats.avg_offspring_count);
        const parts = [`${spawnsTotal} spawn${spawnsTotal === 1 ? '' : 's'} logged by breeders`];
        if (spawns30d > 0) parts.push(`${spawns30d} in the last 30 days`);
        if (avgOffspring != null) parts.push(`avg ${Math.round(avgOffspring)} fry per spawn`);
        const spawnNote = document.createElement('div');
        spawnNote.className = 'gauge-real-note';
        spawnNote.style.marginTop = '6px';
        spawnNote.innerHTML = `<span class="dot spawn"></span> ${parts.join(' · ')}`;
        lastEl.insertAdjacentElement('afterend', spawnNote);
        lastEl = spawnNote;
      }
    }

              const avatar = school.avatar_url
                ? `<img class="school-avatar" src="${school.avatar_url}" alt="${school.name}">`
                : `<div class="school-avatar school-avatar-fallback">${(school.name || '?').charAt(0)}</div>`;
              const link = school.slug ? `/app/schools/${school.slug}` : '#';
              const members = school.member_count || 0;

              schoolsHtml += `<a href="${link}" class="school-chip">
                ${avatar}
                <div class="school-chip-info">
                  <span class="school-chip-name">${school.name}</span>
                  <span class="school-chip-members">${members} member${members !== 1 ? 's' : ''}</span>
                </div>
              </a>`;
            });

            schoolsHtml += `</div></div>`;
            wrapper.insertAdjacentHTML('beforeend', schoolsHtml);
          }
        }
      } catch (e) { console.warn('[Species] Schools fetch failed:', e); }

      // ─── 4. Upcoming Tides (events) related to this species ────────────
      try {
        const now = new Date().toISOString();
        const tidesRes = await fetch(
          `${SB_URL}/rest/v1/tides?starts_at=gte.${now}&order=starts_at.asc&limit=50&select=id,title,tide_type,starts_at,location_name,species_tags,rsvp_count`,
          { headers: { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}` } }
        );
        if (tidesRes.ok) {
          const tides = await tidesRes.json();
          const matching = tides.filter(t => {
            const tags = (t.species_tags || []).map(tag => tag.toLowerCase());
            return tags.some(tag => tag.includes(sci) || tag.includes(common) || sci.includes(tag) || common.includes(tag));
          });

          if (matching.length > 0) {
            let tidesHtml = `<div class="community-section-card" id="sec-upcoming-tides">
              <div class="community-section-header">
                <h2 class="community-section-title">🌊 Upcoming Tides</h2>
                <span class="community-section-count">${matching.length} event${matching.length !== 1 ? 's' : ''}</span>
              </div>
              <div class="tides-grid">`;

            matching.slice(0, 4).forEach(tide => {
              const date = new Date(tide.starts_at);
              const dateStr = date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
              const timeStr = date.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
              const typeLabel = tide.tide_type ? tide.tide_type.replace(/_/g, ' ') : 'Event';
              const rsvp = tide.rsvp_count || 0;

              tidesHtml += `<div class="tide-event-card">
                <div class="tide-date-col">
                  <span class="tide-month">${date.toLocaleDateString(undefined, { month: 'short' })}</span>
                  <span class="tide-day">${date.getDate()}</span>
                </div>
                <div class="tide-info">
                  <div class="tide-title">${tide.title || 'Untitled Event'}</div>
                  <div class="tide-meta">
                    <span class="tide-type-badge">${typeLabel}</span>
                    ${tide.location_name ? `<span class="tide-location">📍 ${tide.location_name}</span>` : ''}
                    <span class="tide-time">🕐 ${timeStr}</span>
                  </div>
                  <div class="tide-rsvp">${rsvp} going</div>
                </div>
              </div>`;
            });

            tidesHtml += `</div>`;
            if (matching.length > 4) {
              tidesHtml += `<a href="/app/tides" class="community-section-link">View all ${matching.length} events →</a>`;
            }
            tidesHtml += `</div>`;
            wrapper.insertAdjacentHTML('beforeend', tidesHtml);
          }
        }
      } catch (e) { console.warn('[Species] Tides fetch failed:', e); }
    }

    // Boot
    init();
  </script>

  <script src="/js/nav.js"></script>
  <script src="/js/footer.js"></script>
  <script src="/js/reveal.js"></script>
</body>
</html>
