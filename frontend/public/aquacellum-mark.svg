<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" fill="none">
  <defs>
    <!-- Primary gradient: teal to violet -->
    <linearGradient id="mark-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <!-- Inner glow gradient -->
    <radialGradient id="inner-glow" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <!-- Outer glow for premium effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer ring — the "cell membrane" -->
  <circle cx="200" cy="200" r="160" stroke="url(#mark-gradient)" stroke-width="8" fill="none" opacity="0.9"/>

  <!-- Inner ambient glow -->
  <circle cx="200" cy="200" r="140" fill="url(#inner-glow)"/>

  <!-- Organic meridian curves — representing water currents / cell division -->
  <!-- Primary vertical flow -->
  <path d="M200 40 C240 100, 260 160, 240 200 C220 240, 240 300, 200 360" 
        stroke="url(#mark-gradient)" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.85"/>
  
  <!-- Secondary vertical flow (mirrored) -->
  <path d="M200 40 C160 100, 140 160, 160 200 C180 240, 160 300, 200 360" 
        stroke="url(#mark-gradient)" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.85"/>

  <!-- Horizontal equator — the "registry line" / data layer -->
  <path d="M40 200 C100 180, 160 170, 200 170 C240 170, 300 180, 360 200" 
        stroke="#5eead4" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M40 200 C100 220, 160 230, 200 230 C240 230, 300 220, 360 200" 
        stroke="#a78bfa" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7"/>

  <!-- Central nucleus — the "living" core -->
  <circle cx="200" cy="200" r="24" fill="url(#mark-gradient)" filter="url(#glow)"/>
  
  <!-- Nucleus highlight -->
  <circle cx="192" cy="192" r="8" fill="#fff" opacity="0.6"/>

  <!-- Orbital dots — data points / species markers -->
  <circle cx="130" cy="130" r="6" fill="#5eead4" opacity="0.8"/>
  <circle cx="270" cy="130" r="6" fill="#22d3ee" opacity="0.8"/>
  <circle cx="130" cy="270" r="6" fill="#a78bfa" opacity="0.8"/>
  <circle cx="270" cy="270" r="6" fill="#8b5cf6" opacity="0.8"/>
</svg>
