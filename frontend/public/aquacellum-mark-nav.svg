<svg xmlns="http://www.w3.org/2000/svg" width="38" height="38" viewBox="0 0 38 38" fill="none">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Cell membrane ring — bold -->
  <circle cx="19" cy="19" r="15" stroke="url(#g)" stroke-width="2.4" fill="none"/>

  <!-- Organic meridian flows — thicker -->
  <path d="M19 4 C22.5 9.5, 24 14, 22.8 19 C21.6 24, 22.5 28.5, 19 34" 
        stroke="url(#g)" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M19 4 C15.5 9.5, 14 14, 15.2 19 C16.4 24, 15.5 28.5, 19 34" 
        stroke="url(#g)" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- Equator lines — more visible -->
  <path d="M4 19 C9.5 17, 14 16.2, 19 16.2 C24 16.2, 28.5 17, 34 19" 
        stroke="#5eead4" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M4 19 C9.5 21, 14 21.8, 19 21.8 C24 21.8, 28.5 21, 34 19" 
        stroke="#a78bfa" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.8"/>

  <!-- Central nucleus — larger, more prominent -->
  <circle cx="19" cy="19" r="4" fill="url(#g)"/>
  <circle cx="17.5" cy="17.5" r="1.3" fill="#fff" opacity="0.7"/>
</svg>
