<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Echo DNA Generator — Unique Variants</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      background: linear-gradient(180deg, #060a14 0%, #0a1628 50%, #081020 100%);
      min-height: 100vh;
      color: #fff;
      padding: 1.5rem;
    }
    h1 {
      text-align: center; font-size: 1.6rem; margin-bottom: 0.3rem;
      background: linear-gradient(135deg, #38bdf8, #a78bfa);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800;
    }
    .subtitle { text-align: center; color: #64748b; font-size: 0.8rem; margin-bottom: 1.5rem; }
    .controls {
      max-width: 720px; margin: 0 auto 2rem; padding: 1.25rem;
      background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px; display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: flex-end;
    }
    .control-group { flex: 1; min-width: 160px; }
    .control-group label { display: block; font-size: 0.6rem; color: #94a3b8; margin-bottom: 0.2rem; text-transform: uppercase; letter-spacing: 0.5px; }
    .control-group input, .control-group select {
      width: 100%; padding: 0.5rem 0.7rem; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.4); color: #fff; font-size: 0.8rem;
    }
    .btn {
      padding: 0.55rem 1.2rem; border-radius: 8px; border: 1px solid rgba(56,189,248,0.3);
      background: rgba(56,189,248,0.1); color: #38bdf8; font-size: 0.8rem; cursor: pointer; font-weight: 600;
    }
    .btn:hover { background: rgba(56,189,248,0.2); }
    .btn-random { border-color: rgba(168,85,247,0.3); background: rgba(168,85,247,0.1); color: #c4b5fd; }
    .btn-random:hover { background: rgba(168,85,247,0.2); }

    .showcase { max-width: 900px; margin: 0 auto; }
    .main-echo {
      display: flex; align-items: center; justify-content: center; padding: 2rem;
      margin-bottom: 1.5rem; border-radius: 20px; border: 1px solid rgba(255,255,255,0.04);
      min-height: 300px; position: relative; overflow: hidden;
      background: radial-gradient(ellipse at center, rgba(56,189,248,0.02) 0%, transparent 70%);
    }
    .echo-render {
      position: relative; display: inline-block;
      animation: echoFloat 3.5s ease-in-out infinite;
    }
    .echo-render img {
      display: block; transition: filter 0.4s ease;
    }
    .echo-aura {
      position: absolute; inset: -12px; border-radius: 50%; pointer-events: none;
      animation: auraPulse 3s ease-in-out infinite;
    }
    .echo-pattern-overlay {
      position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen;
    }
    .echo-particles {
      position: absolute; inset: 0; pointer-events: none; overflow: hidden;
    }
    .echo-particle {
      position: absolute; border-radius: 50%; opacity: 0;
      animation: particleRise 3.5s ease-in-out infinite;
    }

    @keyframes echoFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    @keyframes auraPulse {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.06); }
    }
    @keyframes particleRise {
      0% { opacity: 0; transform: translateY(0) scale(0.5); }
      25% { opacity: 0.9; }
      70% { opacity: 0.4; transform: translateY(-35px) scale(0.7); }
      100% { opacity: 0; transform: translateY(-50px) scale(0.2); }
    }

    .traits-panel {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 0.5rem; margin-bottom: 2rem; max-width: 700px; margin-left: auto; margin-right: auto;
    }
    .trait-badge {
      padding: 0.5rem 0.6rem; border-radius: 10px;
      background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06); text-align: center;
    }
    .trait-badge .t-label { font-size: 0.55rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
    .trait-badge .t-value { font-size: 0.78rem; font-weight: 600; margin-top: 0.1rem; }
    .color-swatch {
      display: inline-block; width: 12px; height: 12px; border-radius: 50%;
      vertical-align: middle; margin-right: 4px; border: 1px solid rgba(255,255,255,0.2);
    }

    .gallery-title { text-align: center; font-size: 1rem; margin-bottom: 1rem; color: #94a3b8; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1rem; }
    .gallery-card {
      background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05);
      border-radius: 14px; padding: 1rem; text-align: center; cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }
    .gallery-card:hover { transform: translateY(-3px); border-color: rgba(56,189,248,0.2); }
    .gc-echo { display: flex; align-items: center; justify-content: center; height: 120px; margin-bottom: 0.5rem; position: relative; }
    .gc-echo img { max-height: 110px; max-width: 110px; object-fit: contain; }
    .gc-wallet { font-size: 0.6rem; color: #64748b; font-family: monospace; }
    .gc-traits { font-size: 0.6rem; color: #94a3b8; margin-top: 0.25rem; }
  </style>
</head>
<body>
  <h1>Echo DNA Generator</h1>
  <p class="subtitle">Each wallet creates a genetically unique Echo. Same art, different soul.</p>

  <div class="controls">
    <div class="control-group" style="min-width: 260px;">
      <label>Wallet Address</label>
      <input type="text" id="wallet-input" value="0xc42eD9F8Fc56F89380a8eD337169899f425Dc934" />
    </div>
    <div class="control-group" style="min-width: 90px;">
      <label>Stage</label>
      <select id="stage-select">
        <option value="0">Egg</option>
        <option value="1">Larva</option>
        <option value="2">Fry</option>
        <option value="3">Juvenile</option>
        <option value="4" selected>Adult</option>
        <option value="5">Elder</option>
        <option value="6">Legendary</option>
      </select>
    </div>
    <button class="btn" onclick="generate()">Generate</button>
    <button class="btn btn-random" onclick="randomWallet()">🎲 Random</button>
  </div>

  <div class="showcase">
    <div class="main-echo" id="main-echo"></div>
    <div class="traits-panel" id="traits-panel"></div>
    <p class="gallery-title">Other unique Echos at this stage</p>
    <div class="gallery" id="gallery"></div>
  </div>

  <script>
    const STAGE_IMAGES = [
      "/echo-stages/stage-0-egg.png",
      "/echo-stages/stage-1-larva.png",
      "/echo-stages/stage-2-fry.png",
      "/echo-stages/stage-3-juvenile.png",
      "/echo-stages/stage-4-adult.png",
      "/echo-stages/stage-5-elder.png",
      "/echo-stages/stage-6-legendary.png",
    ];
    const BODY_NAMES = ["Sleek","Round","Angular","Flowing","Eel-like","Puffer","Ray-finned","Seahorse"];
    const PATTERN_NAMES = ["Spots","Stripes","Marbling","Bioluminescent","Scales","Galaxy Swirl","Ripples","Diamond","Fractal","Nebula","Coral","Plain"];
    const FIN_NAMES = ["Flowing Veil","Spiky","Fan","Ribbon","Split","Crown","Whisker","Sail","Feather","Trident"];
    const EYE_NAMES = ["Round","Almond","Galaxy","Gem","Ancient","Ember"];
    const MARK_NAMES = ["Star Forehead","Tail Ring","Glowing Barbels","Cheek Dots","Crown Mark","Heart","Lightning","Spiral","Three Dots","Crescent","Double Stripe","Teardrop","Halo","Belly Spot","Fin Glow","—","—","—","—","—"];

    function generateDna(wallet) {
      const addr = wallet.toLowerCase();
      let hash = 0;
      for (let i = 0; i < addr.length; i++) {
        hash = ((hash << 5) - hash) + addr.charCodeAt(i);
        hash = hash & hash;
      }
      const seed = Math.abs(hash);
      return {
        seed,
        bodyShape: seed % 8,
        pattern: (seed >> 4) % 12,
        finStyle: (seed >> 8) % 10,
        eyeType: (seed >> 12) % 6,
        signatureMark: (seed >> 16) % 20,
        baseHue: (seed >> 3) % 360,
        secondaryHue: (seed >> 7) % 360,
      };
    }

    function renderEcho(dna, stage, imgSize = 220) {
      const { baseHue, secondaryHue, pattern } = dna;
      const artBaseHue = 190;
      const hueRotate = baseHue - artBaseHue;

      let opacity = 1, glowPx = 0, showAura = false, showParticles = false;
      if (stage === 1) opacity = 0.55;
      if (stage === 2) opacity = 0.8;
      if (stage === 3) glowPx = 6;
      if (stage === 4) glowPx = 10;
      if (stage === 5) { glowPx = 14; showAura = true; }
      if (stage === 6) { glowPx = 18; showAura = true; showParticles = true; }

      const glowColor = `hsl(${secondaryHue}, 70%, 55%)`;
      const filter = `hue-rotate(${hueRotate}deg) saturate(110%) ${glowPx > 0 ? `drop-shadow(0 0 ${glowPx}px ${glowColor})` : ''}`;

      let auraHtml = '';
      if (showAura) {
        auraHtml = `<div class="echo-aura" style="background: radial-gradient(circle, ${glowColor}25 0%, transparent 65%);"></div>`;
      }

      let particlesHtml = '';
      if (showParticles) {
        particlesHtml = '<div class="echo-particles">';
        for (let i = 0; i < 5; i++) {
          const c = i % 2 === 0 ? `hsl(${baseHue}, 80%, 75%)` : `hsl(${secondaryHue}, 75%, 70%)`;
          particlesHtml += `<div class="echo-particle" style="left:${20+i*14}%;bottom:${15+i*4}%;width:${3+i%2}px;height:${3+i%2}px;background:${c};animation-delay:${i*0.6}s;"></div>`;
        }
        particlesHtml += '</div>';
      }

      return `
        <div class="echo-render" style="width:${imgSize}px;height:${imgSize}px;position:relative;">
          ${auraHtml}
          <img src="${STAGE_IMAGES[stage]}" alt="Echo" style="width:100%;height:100%;object-fit:contain;filter:${filter};opacity:${opacity};" />
          ${particlesHtml}
        </div>
      `;
    }

    function randomWallet() {
      let w = '0x';
      for (let i = 0; i < 40; i++) w += '0123456789abcdef'[Math.floor(Math.random()*16)];
      document.getElementById('wallet-input').value = w;
      generate();
    }

    function generate() {
      const wallet = document.getElementById('wallet-input').value;
      const stage = parseInt(document.getElementById('stage-select').value);
      const dna = generateDna(wallet);

      // Main
      document.getElementById('main-echo').innerHTML = renderEcho(dna, stage, 250);

      // Traits
      document.getElementById('traits-panel').innerHTML = `
        <div class="trait-badge"><div class="t-label">Body</div><div class="t-value">${BODY_NAMES[dna.bodyShape]}</div></div>
        <div class="trait-badge"><div class="t-label">Primary Color</div><div class="t-value"><span class="color-swatch" style="background:hsl(${dna.baseHue},65%,55%)"></span>${dna.baseHue}°</div></div>
        <div class="trait-badge"><div class="t-label">Accent Color</div><div class="t-value"><span class="color-swatch" style="background:hsl(${dna.secondaryHue},60%,50%)"></span>${dna.secondaryHue}°</div></div>
        <div class="trait-badge"><div class="t-label">Pattern</div><div class="t-value">${PATTERN_NAMES[dna.pattern]}</div></div>
        <div class="trait-badge"><div class="t-label">Fin Style</div><div class="t-value">${FIN_NAMES[dna.finStyle]}</div></div>
        <div class="trait-badge"><div class="t-label">Eye</div><div class="t-value">${EYE_NAMES[dna.eyeType]}</div></div>
        <div class="trait-badge"><div class="t-label">Mark</div><div class="t-value">${MARK_NAMES[dna.signatureMark]}</div></div>
        <div class="trait-badge"><div class="t-label">Seed</div><div class="t-value" style="font-family:monospace;font-size:0.65rem">${dna.seed}</div></div>
      `;

      // Gallery
      let html = '';
      for (let i = 0; i < 6; i++) {
        let w = '0x';
        for (let j = 0; j < 40; j++) w += '0123456789abcdef'[Math.floor(Math.random()*16)];
        const d = generateDna(w);
        html += `
          <div class="gallery-card" onclick="document.getElementById('wallet-input').value='${w}';generate();">
            <div class="gc-echo">${renderEcho(d, stage, 110)}</div>
            <div class="gc-wallet">${w.slice(0,6)}...${w.slice(-4)}</div>
            <div class="gc-traits">${dna.baseHue !== d.baseHue ? '🎨' : ''} ${PATTERN_NAMES[d.pattern]} · ${d.baseHue}°</div>
          </div>
        `;
      }
      document.getElementById('gallery').innerHTML = html;
    }

    generate();
  </script>
</body>
</html>
