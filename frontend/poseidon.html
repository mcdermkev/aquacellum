<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poseidon — AI Fish Care Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/shared.css">
  <style>
    html,body{height:100%}
    body{height:100vh;overflow:hidden;display:flex;flex-direction:column}
    .chat-container{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:16px;position:relative;z-index:1;max-width:800px;width:100%;margin:0 auto}
    .msg{display:flex;gap:12px;max-width:85%;animation:msgIn 0.3s ease}
    .msg-user{align-self:flex-end;flex-direction:row-reverse}
    .msg-ai{align-self:flex-start}
    .msg-avatar{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:0.9rem;flex-shrink:0}
    .msg-ai .msg-avatar{background:linear-gradient(135deg,rgba(167,139,250,0.2),rgba(56,189,248,0.15));border:1px solid rgba(167,139,250,0.2)}
    .msg-user .msg-avatar{background:linear-gradient(135deg,rgba(56,189,248,0.2),rgba(52,211,153,0.15));border:1px solid rgba(56,189,248,0.2)}
    .msg-bubble{padding:14px 18px;border-radius:var(--radius-md);font-size:0.88rem;line-height:1.6}
    .msg-ai .msg-bubble{background:var(--glass-bg);border:1px solid var(--glass-border);color:var(--text-primary)}
    .msg-user .msg-bubble{background:linear-gradient(135deg,rgba(56,189,248,0.15),rgba(167,139,250,0.12));border:1px solid rgba(56,189,248,0.15);color:var(--text-primary)}
    @keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .suggestions{display:flex;gap:8px;padding:0 24px 12px;flex-wrap:wrap;justify-content:center;position:relative;z-index:1;max-width:800px;margin:0 auto;width:100%}
    .sug-btn{padding:8px 16px;font-size:0.78rem;font-weight:500;color:var(--text-secondary);background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:20px;transition:var(--transition);white-space:nowrap}
    .sug-btn:hover{color:var(--text-primary);border-color:rgba(167,139,250,0.3);background:rgba(167,139,250,0.08)}
    .input-bar{display:flex;align-items:center;gap:12px;padding:16px 24px;background:rgba(6,8,16,0.9);border-top:1px solid var(--glass-border);position:relative;z-index:1}
    .input-bar input{flex:1;padding:14px 20px;font-size:0.9rem;font-family:'Inter',sans-serif;color:var(--text-primary);background:var(--bg-elevated);border:1px solid var(--glass-border);border-radius:var(--radius-sm);outline:none;transition:var(--transition)}
    .input-bar input:focus{border-color:rgba(167,139,250,0.3);box-shadow:0 0 0 3px rgba(167,139,250,0.08)}
    .input-bar input::placeholder{color:var(--text-muted)}
    .send-btn{width:46px;height:46px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--violet-400),var(--ocean-400));border-radius:var(--radius-sm);color:#fff;font-size:1.1rem;transition:var(--transition)}
    .send-btn:hover{transform:scale(1.05);box-shadow:0 4px 16px rgba(167,139,250,0.3)}
    .powered-badge{text-align:center;padding:8px;font-size:0.7rem;color:var(--text-muted);position:relative;z-index:1}
    .typing-dots{display:flex;gap:4px;padding:14px 18px}
    .typing-dots span{width:8px;height:8px;border-radius:50%;background:var(--text-muted);animation:bounce 1.4s infinite}
    .typing-dots span:nth-child(2){animation-delay:0.2s}
    .typing-dots span:nth-child(3){animation-delay:0.4s}
    @keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
    @media(max-width:768px){.chat-container{padding:16px}.suggestions{padding:0 16px 8px}.input-bar{padding:12px 16px}.msg{max-width:92%}}
  </style>
  <link rel="canonical" href="https://aquacellum.com/poseidon">
  <meta property="og:url" content="https://aquacellum.com/poseidon">
  <meta property="og:site_name" content="Aquacellum">
  <meta property="og:image" content="https://aquacellum.com/og-banner.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Poseidon — AI Fish Care Assistant">
</head>
<body>
  <header id="site-nav"></header>
  <div class="chat-container" id="chatContainer"></div>
  <div class="suggestions" id="suggestions"></div>
  <div class="input-bar"><input type="text" id="msgInput" placeholder="Ask Poseidon about fish care..." autocomplete="off"><button class="send-btn" id="sendBtn">➤</button></div>
  <div class="powered-badge">Powered by Poseidon AI 🔱</div>
  <div class="toast" id="toast"></div>
<script>
const SUPABASE_URL='https://yahsdztnvsykzecjatsl.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlhaHNkenRudnN5a3plY2phdHNsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0OTQwMDgsImV4cCI6MjA5NjA3MDAwOH0.3anqDFU9hUjZg2AFWJlXSBbwSM-knNrmb-uQ_Baq98I';

const suggestions=['My ammonia is high','How often to feed fry?','Is my pH safe for discus?','Breeding tips for L046'];
const demoConvo=[
  {role:'user',text:'My ammonia reading is 0.5 ppm. Is this dangerous?'},
  {role:'ai',text:'Yes, 0.5 ppm ammonia is concerning. Any reading above 0 ppm is stressful for fish and can cause gill damage. Here\'s what I recommend:\n\n1. Do an immediate 50% water change with dechlorinated water\n2. Add a dose of Seachem Prime to detoxify ammonia for 24-48 hours\n3. Check your filter — make sure it\'s running and the media hasn\'t been replaced recently\n4. Test again in 12 hours\n\nIf this is a new tank, your nitrogen cycle may not be established yet. Would you like me to walk you through a fish-in cycle protocol?'},
  {role:'user',text:'It\'s a 3-week old tank. Should I add more bacteria?'},
  {role:'ai',text:'At 3 weeks, your cycle is likely in the middle stage — converting ammonia to nitrite. Adding bottled bacteria (like Fritz TurboStart or Dr. Tim\'s) can definitely help speed things up.\n\nHere\'s my recommendation:\n• Dose bottled bacteria directly into the filter\n• Keep temperature at 78-80°F to encourage bacterial growth\n• Don\'t clean the filter or gravel during cycling\n• Feed very lightly — once per day, small amounts\n• Continue daily Prime dosing until ammonia and nitrite both read 0\n\nYou should see ammonia start to drop within the next week. Keep testing daily!'}
];

const aiResponses=[
  'Great question! Let me think about that for your specific setup. Generally, water parameters are the most critical factor. What are your current readings for pH, ammonia, nitrite, and nitrate?',
  'Based on what you\'re describing, I\'d recommend starting with a 25% water change and testing your parameters. Consistency is key — sudden changes stress fish more than slightly imperfect but stable conditions.',
  'That\'s a common concern among aquarists. The good news is that most issues are solvable with patience and the right approach. Can you tell me more about your tank size, filtration, and current stock?',
  'For breeding success, you\'ll want to focus on three things: water quality, diet conditioning, and proper trigger conditions. Each species has different requirements — what species are you working with?',
  'I\'d be happy to help with that! Temperature, pH, and hardness all play important roles. Let me give you species-specific recommendations based on their natural habitat.'
];

let messages=[...demoConvo];
const chat=document.getElementById('chatContainer');
const sugEl=document.getElementById('suggestions');
const input=document.getElementById('msgInput');

function renderMessages(){
  chat.innerHTML=messages.map(m=>`
    <div class="msg msg-${m.role==='user'?'user':'ai'}">
      <div class="msg-avatar">${m.role==='user'?'👤':'🔱'}</div>
      <div class="msg-bubble">${m.text.replace(/\n/g,'<br>')}</div>
    </div>`).join('');
  chat.scrollTop=chat.scrollHeight;
}

function renderSuggestions(){
  sugEl.innerHTML=suggestions.map(s=>`<button class="sug-btn">${s}</button>`).join('');
  sugEl.querySelectorAll('.sug-btn').forEach(b=>b.addEventListener('click',()=>sendMessage(b.textContent)));
}

function sendMessage(text){
  if(!text.trim())return;
  messages.push({role:'user',text:text.trim()});
  input.value='';
  sugEl.innerHTML='';
  renderMessages();
  // Show typing
  const typingDiv=document.createElement('div');
  typingDiv.className='msg msg-ai';
  typingDiv.innerHTML='<div class="msg-avatar">🔱</div><div class="typing-dots"><span></span><span></span><span></span></div>';
  chat.appendChild(typingDiv);
  chat.scrollTop=chat.scrollHeight;
  setTimeout(()=>{
    typingDiv.remove();
    const resp=aiResponses[Math.floor(Math.random()*aiResponses.length)];
    messages.push({role:'ai',text:resp});
    renderMessages();
    renderSuggestions();
  },1200+Math.random()*800);
}

document.getElementById('sendBtn').addEventListener('click',()=>sendMessage(input.value));
input.addEventListener('keydown',e=>{if(e.key==='Enter')sendMessage(input.value)});

renderMessages();
renderSuggestions();
</script>
<script src="/js/nav.js"></script>
<script src="/js/footer.js"></script>
<script src="/js/reveal.js"></script>
</body>
</html>
