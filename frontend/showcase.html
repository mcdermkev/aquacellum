<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Showcase — Aquacellum</title>
  <meta name="description" content="A public window into a living aquarium — see the tanks, the fish, and what's available for local pickup on Aquacellum.">
  <!-- Generic, static Open Graph card. These public pages are served as static
       HTML via a rewrite (no server render), so per-room OG cards are a later
       SSR/prerender follow-up; crawlers see this generic card today. Browsers
       still get an accurate <title> update at runtime (see enhanceMeta). -->
  <meta property="og:title" content="Aquarium Showcase — Aquacellum">
  <meta property="og:description" content="A public window into a living aquarium. See the tanks and fish, and find what's available for local pickup.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/icons/icon-512.png">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/shared.css">

  <style>
    .showcase-hero { padding: 2.5rem 0 1.5rem; }
    .showcase-kicker { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--violet-300, #c4b5fd); }
    .showcase-title { font-family: 'Outfit', sans-serif; font-size: 2rem; font-weight: 800; color: #fff; margin: 0.4rem 0 0.6rem; }
    .showcase-desc { font-size: 0.95rem; line-height: 1.65; color: var(--text-secondary); max-width: 640px; }

    .tank-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin: 1.5rem 0 3rem; }
    .tank-card { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: var(--radius-md, 16px); overflow: hidden; backdrop-filter: blur(12px); transition: var(--transition); }
    .tank-card:hover { border-color: rgba(139,92,246,0.25); transform: translateY(-2px); }
    .tank-card__visual { height: 150px; display: flex; align-items: center; justify-content: center; font-size: 2.6rem; background: linear-gradient(135deg, rgba(96,165,250,0.10), rgba(52,211,153,0.06)); }
    .tank-card__body { padding: 16px 18px 20px; }
    .tank-card__label { font-family: 'Outfit', sans-serif; font-size: 1.05rem; font-weight: 700; color: #fff; margin: 0; }
    .tank-card__caption { font-size: 0.82rem; line-height: 1.55; color: var(--text-secondary); margin-top: 6px; }
    .tank-facts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .tank-fact { padding: 3px 10px; border-radius: 50px; font-size: 0.65rem; font-weight: 600; background: rgba(139,92,246,0.08); border: 1px solid rgba(139,92,246,0.2); color: var(--violet-300, #c4b5fd); }

    .specimen-list { list-style: none; margin: 14px 0 0; padding: 12px 0 0; border-top: 1px solid var(--glass-border); display: flex; flex-direction: column; gap: 10px; }
    .specimen-item { display: flex; flex-direction: column; gap: 2px; }
    .specimen-name { font-size: 0.85rem; font-weight: 600; color: var(--text-primary, #f8fafc); }
    .specimen-species { font-size: 0.75rem; color: var(--text-muted); font-style: italic; }
    .specimen-meta { font-size: 0.7rem; color: var(--text-muted); }
    .specimen-story { font-size: 0.78rem; line-height: 1.5; color: var(--text-secondary); }

    .tank-commerce { margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: rgba(52,211,153,0.06); border: 1px solid rgba(52,211,153,0.25); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .tank-commerce__info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .tank-commerce__pack { font-size: 0.82rem; font-weight: 700; color: var(--emerald-300, #6ee7b7); }
    .tank-commerce__meta { font-size: 0.7rem; color: var(--text-muted); }
    .tank-commerce__buy { flex-shrink: 0; padding: 8px 16px; border-radius: 10px; font-size: 0.8rem; font-weight: 700; text-decoration: none; background: linear-gradient(135deg, var(--emerald-400, #34d399), var(--teal-500, #14b8a6)); color: #04231a; }
    .tank-commerce__buy:hover { filter: brightness(1.08); }
    .tank-reserve { margin-top: 10px; }
    .tank-reserve__toggle { width: 100%; padding: 8px 12px; border-radius: 10px; font-size: 0.78rem; font-weight: 600; cursor: pointer; background: rgba(255,255,255,0.04); border: 1px solid var(--glass-border); color: var(--text-primary, #f8fafc); }
    .tank-reserve__toggle:hover { border-color: rgba(52,211,153,0.35); }
    .tank-reserve__form { margin-top: 10px; display: none; flex-direction: column; gap: 8px; }
    .tank-reserve__form.open { display: flex; }
    .tank-reserve__form input, .tank-reserve__form select, .tank-reserve__form textarea { width: 100%; padding: 8px 10px; border-radius: 8px; background: rgba(0,0,0,0.25); border: 1px solid var(--glass-border); color: #fff; font-size: 0.8rem; font-family: inherit; }
    .tank-reserve__row { display: flex; gap: 8px; }
    .tank-reserve__row select { flex: 0 0 90px; }
    .tank-reserve__row input { flex: 1; }
    .tank-reserve__send { padding: 9px 14px; border-radius: 10px; font-size: 0.8rem; font-weight: 700; cursor: pointer; border: none; background: linear-gradient(135deg, var(--emerald-400, #34d399), var(--teal-500, #14b8a6)); color: #04231a; }
    .tank-reserve__send:disabled { opacity: 0.6; cursor: default; }
    .tank-reserve__status { font-size: 0.74rem; color: var(--text-muted); min-height: 1em; }
    .tank-reserve__status.ok { color: var(--emerald-300, #6ee7b7); }
    .tank-reserve__status.err { color: #fca5a5; }

    .state-panel { max-width: 560px; margin: 5rem auto; text-align: center; padding: 0 1rem; }
    .state-panel h3 { font-family: 'Outfit', sans-serif; font-size: 1.3rem; color: #fff; margin-bottom: 0.6rem; }
    .state-panel p { font-size: 0.9rem; color: var(--text-secondary); line-height: 1.6; }
  </style>
</head>
<body>
  <!-- Shared Navigation -->
  <header id="site-nav"></header>

  <!-- Loading -->
  <div id="loadingState" class="state-panel">
    <h3>Loading showcase…</h3>
    <p>Fetching this aquarium's public window.</p>
  </div>

  <!-- Content (hidden until loaded) -->
  <div id="showcaseContent" class="container" style="display:none;">
    <header class="showcase-hero">
      <div class="showcase-kicker">Aquarium Showcase</div>
      <h1 class="showcase-title" id="roomTitle"></h1>
      <p class="showcase-desc" id="roomDesc" style="display:none;"></p>
    </header>
    <div class="tank-grid" id="tankGrid"></div>
  </div>

  <footer id="site-footer"></footer>

  <script src="/js/nav.js"></script>
  <script src="/js/footer.js"></script>
  <script src="/js/reveal.js"></script>
  <script>
    // ── Read the room slug from /showcase/<room-slug> ───────────────────────
    function getRoomSlugFromUrl() {
      const match = window.location.pathname.match(/\/showcase\/(.+)/);
      return match ? decodeURIComponent(match[1].replace(/\/+$/, "")) : null;
    }

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = String(text);
      return node;
    }

    // Only allow https or same-origin image URLs (drops javascript:/data:/malformed).
    function safeImageUrl(value) {
      if (!value) return "";
      try {
        const url = new URL(value, window.location.origin);
        return url.protocol === "https:" || url.origin === window.location.origin ? url.href : "";
      } catch { return ""; }
    }

    function showState(title, body) {
      const panel = document.getElementById("loadingState");
      panel.replaceChildren(element("h3", "", title), element("p", "", body));
      panel.style.display = "";
      document.getElementById("showcaseContent").style.display = "none";
    }

    // Browsers get an accurate title/description; crawlers get the static card
    // in <head> (per-room OG requires SSR — tracked as a follow-up).
    function enhanceMeta(room) {
      if (room.title) {
        document.title = `${room.title} — Showcase | Aquacellum`;
        const ogTitle = document.querySelector('meta[property="og:title"]');
        if (ogTitle) ogTitle.setAttribute("content", `${room.title} — Aquacellum`);
      }
      if (room.description) {
        const desc = document.querySelector('meta[name="description"]');
        if (desc) desc.setAttribute("content", room.description);
        const ogDesc = document.querySelector('meta[property="og:description"]');
        if (ogDesc) ogDesc.setAttribute("content", room.description);
      }
    }

    function buildFacts(facts) {
      const wrap = element("div", "tank-facts");
      if (!facts) return wrap;
      if (Number(facts.volumeLiters) > 0) wrap.append(element("span", "tank-fact", `${facts.volumeLiters} L`));
      if (facts.tankType) wrap.append(element("span", "tank-fact", String(facts.tankType)));
      if (Number.isFinite(Number(facts.inhabitantCount))) {
        const n = Number(facts.inhabitantCount);
        wrap.append(element("span", "tank-fact", `${n} inhabitant${n === 1 ? "" : "s"}`));
      }
      return wrap;
    }

    function buildSpecimen(spec) {
      const item = element("li", "specimen-item");
      item.append(element("span", "specimen-name", spec.publicName || "Unnamed specimen"));
      const species = spec.species || {};
      const speciesLabel = species.commonName || species.scientificName;
      if (speciesLabel) item.append(element("span", "specimen-species", speciesLabel));
      const meta = [spec.sex, spec.lifeStage].filter(Boolean).join(" · ");
      if (meta) item.append(element("span", "specimen-meta", meta));
      if (spec.story) item.append(element("span", "specimen-story", spec.story));
      return item;
    }

    function formatCents(cents) {
      const n = Number(cents);
      if (!Number.isFinite(n) || n <= 0) return null;
      return new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" }).format(n / 100);
    }

    function fulfillmentLabel(value) {
      if (value === "shipping") return "Ships";
      if (value === "pickup") return "Local pickup";
      return "Ask seller";
    }

    // The tub's buyable pack (P2 commerce seam). Only present when the tank is linked to an active,
    // owner-verified listing; the buy link points at the marketplace, never an off-site checkout.
    function buildCommerce(commerce) {
      const wrap = element("div", "tank-commerce");
      const info = element("div", "tank-commerce__info");
      const packCount = Number(commerce.packSize);
      const packText = commerce.isBatch && Number.isFinite(packCount) && packCount > 0
        ? `Pack of ${packCount}` : "Available now";
      const price = formatCents(commerce.priceCents);
      info.append(element("span", "tank-commerce__pack", price ? `${packText} — ${price}` : packText));
      info.append(element("span", "tank-commerce__meta", fulfillmentLabel(commerce.fulfillment)));
      wrap.append(info);
      if (typeof commerce.buyPath === "string" && commerce.buyPath.startsWith("/")) {
        const buy = element("a", "tank-commerce__buy", "View & buy");
        buy.href = commerce.buyPath;
        wrap.append(buy);
      }
      return wrap;
    }

    // Guest pickup inquiry (P3): a no-account "reserve for local pickup" lead. Posts to the
    // storefront-detail endpoint, which resolves the seller and stores the lead. No login, no payment.
    function buildReserve(commerce, roomSlug) {
      const wrap = element("div", "tank-reserve");
      const toggle = element("button", "tank-reserve__toggle", "Reserve for local pickup");
      toggle.type = "button";
      const form = element("form", "tank-reserve__form");

      const name = element("input");
      name.type = "text"; name.placeholder = "Your name"; name.maxLength = 80; name.required = true;
      name.autocomplete = "name";

      const row = element("div", "tank-reserve__row");
      const kind = element("select");
      for (const [val, label] of [["email", "Email"], ["phone", "Phone"]]) {
        const opt = element("option", "", label); opt.value = val; kind.append(opt);
      }
      const contact = element("input");
      contact.type = "text"; contact.placeholder = "How the seller reaches you"; contact.maxLength = 120; contact.required = true;
      row.append(kind, contact);

      const msg = element("textarea");
      msg.placeholder = "Optional note (e.g. pickup day that works)"; msg.rows = 2; msg.maxLength = 1000;

      const send = element("button", "tank-reserve__send", "Send request");
      send.type = "submit";
      const status = element("div", "tank-reserve__status");

      form.append(name, row, msg, send, status);
      toggle.addEventListener("click", () => {
        form.classList.toggle("open");
        if (form.classList.contains("open")) name.focus();
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        status.className = "tank-reserve__status";
        status.textContent = "";
        if (!name.value.trim() || !contact.value.trim()) {
          status.className = "tank-reserve__status err"; status.textContent = "Please add your name and contact.";
          return;
        }
        send.disabled = true; send.textContent = "Sending…";
        try {
          const res = await fetch("/api/storefront-detail?action=pickup-inquiry", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              listingKey: commerce.listingKey,
              guestName: name.value.trim(),
              contactKind: kind.value,
              contactValue: contact.value.trim(),
              message: msg.value.trim() || null,
              roomSlug: roomSlug || null,
            }),
          });
          if (res.status === 201) {
            form.replaceChildren(element("div", "tank-reserve__status ok", "Sent — the seller will reach out to arrange pickup."));
          } else if (res.status === 429) {
            status.className = "tank-reserve__status err"; status.textContent = "Too many requests right now. Please try again shortly.";
            send.disabled = false; send.textContent = "Send request";
          } else if (res.status === 404) {
            status.className = "tank-reserve__status err"; status.textContent = "This pack isn't available anymore.";
            send.disabled = false; send.textContent = "Send request";
          } else {
            status.className = "tank-reserve__status err"; status.textContent = "Please check your details and try again.";
            send.disabled = false; send.textContent = "Send request";
          }
        } catch {
          status.className = "tank-reserve__status err"; status.textContent = "Network error — please try again.";
          send.disabled = false; send.textContent = "Send request";
        }
      });

      wrap.append(toggle, form);
      return wrap;
    }

    function buildTank(tank, roomSlug) {
      const card = element("article", "tank-card");
      const visual = element("div", "tank-card__visual");
      // Hero image: the linked pack's product photo when present (already-public listing photoUrl),
      // otherwise the emoji placeholder until the showcase-media pipeline lands.
      const heroUrl = safeImageUrl(tank.commerce && tank.commerce.photoUrl);
      if (heroUrl) {
        const img = element("img");
        img.src = heroUrl; img.alt = tank.label || "Aquarium"; img.loading = "lazy";
        img.style.width = "100%"; img.style.height = "100%"; img.style.objectFit = "cover";
        visual.style.padding = "0";
        visual.append(img);
      } else {
        visual.textContent = "🐟";
      }
      const body = element("div", "tank-card__body");
      body.append(element("h2", "tank-card__label", tank.label || tank.slug || "Tank"));
      if (tank.caption) body.append(element("p", "tank-card__caption", tank.caption));
      body.append(buildFacts(tank.facts));

      const specimens = Array.isArray(tank.specimens) ? tank.specimens : [];
      if (specimens.length) {
        const list = element("ul", "specimen-list");
        specimens.forEach((spec) => list.append(buildSpecimen(spec)));
        body.append(list);
      }
      if (tank.commerce && typeof tank.commerce === "object") {
        body.append(buildCommerce(tank.commerce));
        if (typeof tank.commerce.listingKey === "string") {
          body.append(buildReserve(tank.commerce, roomSlug));
        }
      }
      card.append(visual, body);
      return card;
    }

    function render(room) {
      enhanceMeta(room);
      document.getElementById("roomTitle").textContent = room.title || "Aquarium Showcase";
      const desc = document.getElementById("roomDesc");
      if (room.description) { desc.textContent = room.description; desc.style.display = ""; }

      const grid = document.getElementById("tankGrid");
      grid.replaceChildren();
      const tanks = Array.isArray(room.tanks) ? room.tanks : [];
      if (!tanks.length) {
        grid.append(element("p", "showcase-desc", "This showcase doesn't have any public tanks yet."));
      } else {
        tanks.forEach((tank) => grid.append(buildTank(tank, room.slug)));
      }

      document.getElementById("loadingState").style.display = "none";
      document.getElementById("showcaseContent").style.display = "";
    }

    async function init() {
      const slug = getRoomSlugFromUrl();
      if (!slug) { showState("Showcase not found", "No showcase was specified in the address."); return; }

      try {
        const res = await fetch(`/api/storefront-detail?action=showcase-room&room=${encodeURIComponent(slug)}`);
        if (res.status === 404) {
          showState("Showcase not available", "This showcase is private or doesn't exist.");
          return;
        }
        if (!res.ok) { showState("Showcase unavailable", "Please try again in a moment."); return; }
        const payload = await res.json();
        if (!payload || !payload.room) { showState("Showcase unavailable", "The showcase data could not be read."); return; }
        render(payload.room);
      } catch {
        showState("Showcase unavailable", "Please try again in a moment.");
      }
    }

    init();
  </script>
</body>
</html>
