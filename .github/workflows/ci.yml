name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Supersede an in-flight run when a newer commit lands on the same ref.
#
# There was no concurrency group before, so pushing twice in quick succession left
# both runs competing for GitHub's shared runner pool — and since the e2e job needed
# a second runner, a backlog was self-inflicting. The older commit's result is not
# interesting once a newer one exists, so cancelling it is free.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
        with:
          # Only the paths this job actually reads.
          #
          # The repo tracks ~919 MB, and a full checkout was the single largest and
          # most variable cost in CI — on one run this step took 13m42s in the e2e
          # job while the identical checkout in test-build took 1m22s, same commit,
          # same minute. Most of that weight is assets no CI job opens:
          # `marketing/` (151 MB of MP4s, including one 50 MB file) and
          # `migration_assets/` (155 MB).
          #
          # `supabase/` and `contracts/` ARE required — the suite reads migration SQL
          # (growoutCloudSync, publicListingProjection, specimenMetadata,
          # migrationOrder, devRlsBypassRemoval), an Edge Function shared module
          # (pushPreferenceGate), and AquadexStorage.sol (specimenIdentity). Dropping
          # either would not fail loudly; those tests would read a missing file, so
          # verify against the suite before trimming this list further.
          sparse-checkout: |
            frontend
            supabase
            contracts

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
