name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (non-blocking)
        run: npm run lint || true
        # Lint has pre-existing errors (1200+). Run for visibility but don't block.
        # TODO: Fix lint errors incrementally and make this blocking.

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
